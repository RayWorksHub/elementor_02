003cspan>Hozzáférés a könyvelőjének\u003c/span>\u003c/span>\u003cspan class=\"ml-cta\">30 napig ingyen kipróbálom\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>\u003cdiv class=\"s-slot wrap\">\u003cdiv class=\"slot\" data-slot=\"digitalis-lendulet:top\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">320 × 100\u003cem>Nagy mobil banner\u003c/em>\u003c/span>\u003cspan class=\"ct\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003cspan class=\"cd\">970 × 250\u003cem>Billboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad fo fo-mb\" style=\"width:320px;height:100px\">\u003cspan class=\"fo-date\">\u003csmall>nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>2026\u003c/small>\u003c/span>\u003cspan class=\"fo-r\">\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest, 30 előadó\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct\">\u003ca class=\"ad fo fo-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · AI, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"cd\">\u003ca class=\"ad fo fo-bb\" style=\"width:970px;height:250px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-r\">\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · egynapos szakmai konferencia · 30 előadó\u003c/span>\u003c/span>\u003cspan class=\"fo-tags\">\u003ci>mesterséges intelligencia\u003c/i>\u003ci>e-kereskedelem\u003c/i>\u003ci>kiberbiztonság\u003c/i>\u003ci>uniós források\u003c/i>\u003c/span>\u003cspan class=\"fo-row\">\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003cspan class=\"fo-note\">Kedvezményes jegyek október 15-ig\u003c/span>\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">Anyagaink a témában\u003c/p>\u003ch2 class=\"h2\">Amit eddig írtunk\u003c/h2>\u003cp class=\"intro\">A programhoz eddig 5 anyag készült el, 3 rovatban. A lista folyamatosan bővül.\u003c/p>\u003cdiv class=\"cards c3\">\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-800.webp\"/>\u003cspan class=\"topic\">Vállalkozásfejlesztés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003c/p>\u003ch3 data-p=\"cikk\">Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\u003c/h3>\u003cp class=\"lead\">Van honlap, közösségi média és egyre több digitális eszköz. A magyar kis- és középvállalkozások egyik következő nagy feladata mégis az lehet, hogy a digitális jelenlétből valódi piaci jelenlétet építsenek.\u003c/p>\u003cp class=\"by\">Óvári László interjúja Magdó Emillel\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/promise-group-800.webp\"/>\u003cspan class=\"topic\">Vállalkozásfejlesztés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003c/p>\u003ch3 data-p=\"cikk\">Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\u003c/h3>\u003cp class=\"lead\">A vállalatok ma már nem csupán licenceket keresnek, hanem olyan technológiai partnereket, amelyek a felhőszolgáltatásoktól az AI-megoldásokon át a kiberbiztonságig képesek támogatni digitális fejlődésüket.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Digitalizáció — a versenyképességünk záloga\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/infoparlament-800.webp\"/>\u003cspan class=\"topic\">Rendezvények, konferenciák\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">GmÉlet\u003c/p>\u003ch3 data-p=\"cikk\">Digitalizáció — a versenyképességünk záloga\u003c/h3>\u003cp class=\"lead\">Az Infóparlament átfogó, magas szintű egyeztető fórum a kormányzat, a piac, a civil és az oktatási szektor részvételével.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-800.webp\"/>\u003cspan class=\"topic\">Munkaerő és képzés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003cspan class=\"flag\">Ami igaz, az igaz\u003c/span>\u003c/p>\u003ch3 data-p=\"cikk\">Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\u003c/h3>\u003cp class=\"lead\">A norvég döntés valódi. Az viszont, ami belőle a magyar vállalkozóhoz megérkezik — „az MI káros, várjunk vele” —, már nem az, amit a norvég kormány mondott. Megnéztük, mi a hír, mi van mögötte, és mit érdemes kezdeni vele egy ötfős cégben.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Díjmentes digitális fejlesztési koncepció — idén még elérhető\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/fejlesztesi-tamogatasok-800.webp\"/>\u003cspan class=\"topic\">Fejlesztési források\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Európai Unió\u003cspan class=\"flag\">Kézzelfogható\u003c/span>\u003c/p>\u003ch3 data-p=\"cikk\">Díjmentes digitális fejlesztési koncepció — idén még elérhető\u003c/h3>\u003cp class=\"lead\">Létezik egy uniós forrásból működő szolgáltatás, amely felméri, hol tart a cége digitálisan, és leírja, mibe érdemes belevágni. Nem kerül pénzbe, és 2026 végén lezárul. Összeszedtük, kinek jár, hogyan lehet hozzájutni, és hol szokott elakadni.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003cdiv class=\"slot-fl\" data-slot=\"digitalis-lendulet:native\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"live-w\" data-h=\"card\">–\u003c/span>\u003c/span>\u003c/div>\u003ca class=\"ad card card-nat\">\u003cspan class=\"ph\">\u003csvg preserveAspectRatio=\"xMidYMid slice\" viewBox=\"0 0 320 180\">\u003crect fill=\"#ffc862\" height=\"180\" width=\"320\">\u003c/rect>\u003crect fill=\"#e9ad4f\" height=\"62\" width=\"320\" y=\"118\">\u003c/rect>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" r=\"26\">\u003c/circle>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" fill-opacity=\".3\" r=\"38\">\u003c/circle>\u003cpolygon fill=\"#26435e\" points=\"40,172 110,112 290,112 250,172\">\u003c/polygon>\u003cg fill=\"none\" stroke=\"#8fb3d6\" stroke-width=\"1.3\">\u003cpath d=\"M86.7 132H276.7M63.3 152H263.3M82 172L146 112M124 172L182 112M166 172L218 112M208 172L254 112\">\u003c/path>\u003c/g>\u003c/svg>\u003c/span>\u003cspan class=\"nat-in\">\u003cspan class=\"nat-chip\">Szponzorált tartalom\u003c/span>\u003cb class=\"nat-t\">Harmadával kisebb energiaszámla: így számolt egy kecskeméti pékség\u003c/b>\u003cspan class=\"nat-l\">Tetőre szerelt napelem, okos mérés és egy tizenkét éves konstrukció. A tulajdonos elmondja, mikor térül ar Pro\u003c/span>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan class=\"pr-sub\">24 órán belül értesítjük, szakértői összefoglalóval és határidő-naptárral.\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cp class=\"kick\">Induló tartalmaink\u003c/p>\u003ch2 class=\"h2\">9 cikk\u003c/h2>\u003cp class=\"intro\">A portál most indul, ezért a cikkállomány szándékosan szűk: azokat az anyagokat tettük ki, amelyeket a szerkesztőség a webre készített. A lista folyamatosan bővül.\u003c/p>\u003cdiv class=\"hl-list\">\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Gazdaság\u003c/b> · Vállalkozásfejlesztés · Óvári László interjúja Magdó Emillel\u003c/p>\u003ch3 data-p=\"cikk\">Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\u003c/h3>\u003cp>Van honlap, közösségi média és egyre több digitális eszköz. A magyar kis- és középvállalkozások egyik következő nagy feladata mégis az lehet, hogy a digitális jelenlétből valódi piaci jelenlétet építsenek.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/promise-group-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Gazdaság\u003c/b> · Vállalkozásfejlesztés · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\u003c/h3>\u003cp>A vállalatok ma már nem csupán licenceket keresnek, hanem olyan technológiai partnereket, amelyek a felhőszolgáltatásoktól az AI-megoldásokon át a kiberbiztonságig képesek támogatni digitális fejlődésüket.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Európa-élményközpont Budapest szívében\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/europa-elmenykozpont-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Európai Unió\u003c/b> · Uniós intézmények · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Európa-élményközpont Budapest szívében\u003c/h3>\u003cp>Kétezer négyzetméteres multimédiás tér, 360 fokos mozi és szerepjáték arról, milyen európai parlamenti képviselőnek lenni.\u003c/p>\u003c/div>\u003c/article>\u003cdiv class=\"slot\" data-slot=\"hirek:infeed\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">300 × 250\u003cem>Medium rectangle, in-read\u003c/em>\u003c/span>\u003cspan class=\"ct cd\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad pb pb-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pb-arcs\">\u003c/span>\u003cspan class=\"pb-logo\">\u003csvg viewBox=\"0 0 24 24\">\u003crect fill=\"#d4f36a\" height=\"24\" rx=\"6\" width=\"24\">\u003c/rect>\u003cpath d=\"M4 15c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003cpath d=\"M4 10c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" opacity=\".5\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003c/svg>Pannonhitel\u003c/span>\u003cb class=\"pb-h\">Fix kamat.\u003cbr/>A futamidő végéig.\u003c/b>\u003cspan class=\"pb-sub\">KKV Beruházási Hitel\u003cbr/>5–150 millió forintig\u003c/span>\u003cspan class=\"pb-cta\">Kiszámolom\u003c/span>\u003cspan class=\"pb-legal\">Tájékoztató jellegű, nem minősül ajánlattételnek.\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct cd\">\u003ca class=\"ad pb pb-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"pb-arcs\">\u003c/span>\u003cspan class=\"pb-logo\">\u003csvg viewBox=\"0 0 24 24\">\u003crect fill=\"#d4f36a\" height=\"24\" rx=\"6\" width=\"24\">\u003c/rect>\u003cpath d=\"M4 15c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003cpath d=\"M4 10c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" opacity=\".5\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003c/svg>Pannonhitel\u003c/span>\u003cspan class=\"pb-txt\">\u003cb>Fix kamat a futamidő végéig\u003c/b>\u003cspan>KKV Beruházási Hitel 5–150 millió forintig\u003c/span>\u003c/span>\u003cspan class=\"pb-cta\">Kiszámolom\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Az Európai Parlament kapcsolattartó irodái\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/ep-irodak-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Európai Unió\u003c/b> · Uniós intézmények · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Az Európai Parlament kapcsolattartó irodái\u003c/h3>\u003cp>Az uniós intézmények helyi jelenléte nem protokoll: kézzelfogható belépési pont a jogszabályi környezethez és a pályázati lehetőségekhez.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"„Nálunk a család az első” — a Fantasy Land mesevilág\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/fantasy-land-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Vállalkozóihíd\u003c/b> · Családi vállalkozás · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">„Nálunk a család az első” — a Fantasy Land mesevilág\u003c/h3>\u003cp>Beszélgetés Juhász-Orbán Líviával a családbarát vállalkozás megálmodásáról és működtetéséről.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Digitalizáció — a versenyképességünk záloga\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/infoparlament-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>GmÉlet\u003c/b> · Rendezvények, konferenciák · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Digitalizáció — a versenyképességünk záloga\u003c/h3>\u003cp>Az Infóparlament átfogó, magas szintű egyeztető fórum a kormányzat, a piac, a civil és az oktatási szektor részvételével.\u003c/p>\u003c/div>\u003c/article>\u003cdiv class=\"slot-fl\" data-slot=\"hirek:native\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"live-w\" data-h=\"row\">–\u003c/span>\u003c/span>\u003c/div>\u003ca class=\"ad natw nat-row\">\u003cspan class=\"ph\">\u003csvg preserveAspectRatio=\"xMidYMid slice\" viewBox=\"0 0 320 180\">\u003crect fill=\"#ffc862\" height=\"180\" width=\"320\">\u003c/rect>\u003crect fill=\"#e9ad4f\" height=\"62\" width=\"320\" y=\"118\">\u003c/rect>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" r=\"26\">\u003c/circle>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" fill-opacity=\".3\" r=\"38\">\u003c/circle>\u003cpolygon fill=\"#26435e\" points=\"40,172 110,112 290,112 250,172\">\u003c/polygon>\u003cg fill=\"none\" stroke=\"#8fb3d6\" stroke-width=\"1.3\">\u003cpath d=\"M86.7 132H276.7M63.3 152H263.3M82 172L146 112M124 172L182 112M166 172L218 112M208 172L254 112\">\u003c/path>\u003c/g>\u003c/svg>\u003c/span>\u003cspan class=\"nat-in\">\u003cspan class=\"nat-chip\">Szponzorált tartalom\u003c/span>\u003cb class=\"nat-t\">Harmadával kisebb energiaszámla: így számolt egy kecskeméti pékség\u003c/b>\u003cspan class=\"nat-l\">Tetőre szerelt napelem, okos mérés és egy tizenkét éves konstrukció. A tulajdonos elmondja, mikor térült meg a beruházás.\u003c/span>\u003cspan class=\"nat-by\">Partnerünk: Napfény Energia Zrt.\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"„Ahogy azt már partnereink megszokhatták…” — Alphasonic Expo\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/alphasonic-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>GmÉlet\u003c/b> · Rendezvények, konferenciák · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">„Ahogy azt már partnereink megszokhatták…” — Alphasonic Expo\u003c/h3>\u003cp>Informatikai és biztonságtechnikai szakmai partnernap közel 30 gyártói standdal.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Gazdaság\u003c/b> · Munkaerő és képzés · Ami igaz, az igaz · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\u003c/h3>\u003cp>A norvég döntés valódi. Az viszont, ami belőle a magyar vállalkozóhoz megérkezik — „az MI káros, várjunk vele” —, már nem az, amit a norvég kormány mondott. Megnéztük, mi a hír, mi van mögötte, és mit érdemes kezdeni vele egy ötfős cégben.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Díjmentes digitális fejlesztési koncepció — idén még elérhető\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/fejlesztesi-tamogatasok-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Európai Unió\u003c/b> · Fejlesztési források · Kézzelfogható · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Díjmentes digitális fejlesztési koncepció — idén még elérhető\u003c/h3>\u003cp>Létezik egy uniós forrásból működő szolgáltatás, amely felméri, hol tart a cége digitálisan, és leírja, mibe érdemes belevágni. Nem kerül pénzbe, és 2026 végén lezárul. Összeszedtük, kinek jár, hogyan lehet hozzájutni, és hol szokott elakadni.\u003c/p>\u003c/div>\u003c/article>\u003c/div>\u003cdiv class=\"wg box\" style=\"margin-top:26px\">\u003ch4>Hamarosan több\u003c/h4>\u003cp>A szerkesztőség folyamatosan dolgozik az új anyagokon. Ha szeretné, hogy értesítsük róluk, iratkozzon fel az eugmonline hírlevélre.\u003c/p>\u003ca class=\"btn\" data-p=\"index\">Feliratkozom a hírlevélre\u003c/a>\u003c/div>\u003c/div>\u003caside>\u003cdiv class=\"slot\" data-slot=\"hirek:podcast\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">320 × 100\u003cem>Podcast-sáv\u003c/em>\u003c/span>\u003cspan class=\"ct cd\">300 × 250\u003cem>Podcast-kártya\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003cdiv class=\"ad pod pod-mb\" data-bars=\"30\" style=\"width:320px;height:100px\">\u003cspan aria-hidden=\"true\" class=\"pod-cover\">\u003cb>Adó\u003cbr/>radar\u003c/b>\u003c/span>\u003cdiv class=\"pod-r\">\u003cspan class=\"pod-meta\">\u003csmall>Podcast, támogató: Kvadráns\u003c/small>\u003cb>Mi változik 2027-ben az áfában?\u003c/b>\u003c/span>\u003cdiv class=\"pod-ctl\">\u003cbutton aria-label=\"Részlet lejátszása\" class=\"pod-play\" type=\"button\">\u003csvg class=\"i-play\" viewBox=\"0 0 24 24\">\u003cpath d=\"M6 3.5v17l15-8.5z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003csvg class=\"i-pause\" viewBox=\"0 0 24 24\">\u003cpath d=\"M6 4h4.5v16H6zM13.5 4H18v16h-4.5z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv aria-hidden=\"true\" class=\"pod-wave\">\u003c/div>\u003cspan class=\"p  kis- és középvállalkozásoknak, valós időben.\u003c/span>\u003cspan class=\"ml-dash\">\u003cspan class=\"ml-dl\">Pénzforgalom, szeptember\u003c/span>\u003cspan class=\"ml-dv\">+2,4 M Ft\u003c/span>\u003cspan class=\"ml-bars\">\u003ci style=\"--h:38%\">\u003c/i>\u003ci style=\"--h:52%\">\u003c/i>\u003ci style=\"--h:44%\">\u003c/i>\u003ci style=\"--h:66%\">\u003c/i>\u003ci style=\"--h:58%\">\u003c/i>\u003ci style=\"--h:88%\">\u003c/i>\u003c/span>\u003cspan class=\"ml-warn\">3 kimenő számla lejárt, emlékeztető kiküldve\u003c/span>\u003c/span>\u003cspan class=\"ml-list\">\u003cspan>NAV Online Számla kapcsolat\u003c/span>\u003cspan>Automatikus banki import\u003c/span>\u003cspan>Hozzáférés a könyvelőjének\u003c/span>\u003c/span>\u003cspan class=\"ml-cta\">30 napig ingyen kipróbálom\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>\u003cdiv class=\"s-slot wrap\">\u003cdiv class=\"slot\" data-slot=\"hirek:foot\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">320 × 100\u003cem>Nagy mobil banner\u003c/em>\u003c/span>\u003cspan class=\"ct\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003cspan class=\"cd\">970 × 90\u003cem>Super leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad fo fo-mb\" style=\"width:320px;height:100px\">\u003cspan class=\"fo-date\">\u003csmall>nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>2026\u003c/small>\u003c/span>\u003cspan class=\"fo-r\">\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest, 30 előadó\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct\">\u003ca class=\"ad fo fo-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · AI, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"cd\">\u003ca class=\"ad fo fo-lb\" style=\"width:970px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · mesterséges intelligencia, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-note\">Kedvezményes jegyek\u003cbr/>október 15-ig\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>","p:cikk":"\u003cdiv class=\"p-hero\">\u003cspan class=\"im\">\u003cimg alt=\"Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-1400.webp\"/>\u003c/span>\u003c/div>\u003cheader class=\"p-head wrap\">\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / \u003ca data-p=\"gazdasag\">Gazdaság\u003c/a>\u003c/p>\u003ch1 class=\"p-h1\">Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\u003c/h1>\u003cp class=\"p-desc\">Van honlap, közösségi média és egyre több digitális eszköz. A magyar kis- és középvállalkozások egyik következő nagy feladata mégis az lehet, hogy a digitális jelenlétből valódi piaci jelenlétet építsenek.\u003c/p>\u003cp class=\"art-meta\">\u003cb>Gazdaság\u003c/b>\u003cspan>Vállalkozásfejlesztés\u003c/span>\u003cspan>Óvári László interjúja Magdó Emillel\u003c/span>\u003c/p>\u003c/header>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003carticle>\u003cdiv class=\"art-img\">\u003cspan class=\"im\">\u003cimg alt=\"Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-1400.webp\"/>\u003c/span>\u003c/div>\u003cdiv class=\"prose\">\u003cp class=\"q\">A magyar vállalkozások digitalizációjáról sok szó esik. Ön mégis azt mondja, hogy marketing szempontból a digitális jelenlét ma is elhanyagolt terület. Mire gondol pontosan?\u003c/p>\u003cp>Elsősorban arra, hogy két különböző dolgot gyakran összekeverünk. Az egyik a digitális eszközök megléte, a másik a digitális piaci jelenlét. Egy vállalkozásnak lehet weboldala, Facebook-oldala, Google Cégprofilja, hírlevélrendszere, sőt hirdethet is. Ettől még nem biztos, hogy a digitális tér valóban támogatja az ügyfélszerzését és az értékesítését.\u003c/p>\u003cp>A Digiméter 2024-es kutatásában például a vizsgált hazai KKV-k 72 százalékának volt honlapja. Ugyanakkor az „Értékesítés és marketing” alindex mindössze 14 pontot ért el a százfokú skálán. A cégek fele egyáltalán nem hirdetett, 70 százalékuk pedig semmilyen formában nem értékesített interneten keresztül.\u003c/p>\u003cp>Ez nagyon jól mutatja a különbséget aközött, hogy egy vállalkozás „fent van” az interneten, vagy a digitális jelenléte valóban üzleti funkciót tölt be.\u003c/p>\u003cp class=\"q\">Akkor nem elsősorban technológiai lemaradásról beszélünk?\u003c/p>\u003cp>Részben természetesen arról is. Az Európai Bizottság 2026-os országjelentése szerint Magyarország továbbra is lemaradásban van az üzleti digitalizáció és a kulcsfontosságú technológiák elterjedése terén, különösen a KKV-k esetében. Az Eurostat adatai szerint 2025-ben az uniós vállalkozások 63,6 százaléka használt valamilyen közösségi médiát, Magyarországon ez az arány 47,3 százalék volt. Ennél csak két uniós országban mértek alacsonyabb értéket.\u003c/p>\u003cp>A technológia megléte azonban önmagában még nem oldja meg a problémát. Érdekes, hogy a Digiméterben a digitális pénzügyek 65 pontot értek el, miközben az értékesítés és marketing csak 14-et. Vagyis sok vállalkozás megtanulta használni az internetbankot, az elektronikus számlát és a digitális pénzügyi szolgáltatásokat. A digitális piacra jutásban viszont jóval kisebb az előrelépés.\u003c/p>\u003cdiv class=\"slot\" data-slot=\"cikk:inart1\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">300 × 250\u003cem>Medium rectangle, in-read\u003c/em>\u003c/span>\u003cspan class=\"ct cd\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad pr pr-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pr-radar r-l\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-name\">PályázatRadar Pro\u003c/span>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan class=\"pr-sub\">24 órán belül értesítjük, szakértői összefoglalóval.\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct cd\">\u003ca class=\"ad pr pr-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"pr-radar r-s\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-txt\">\u003csmall>PályázatRadar Pro\u003c/small>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan>24 órán belül értesítjük, szakértői összefoglalóval.\u003c/span>\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cp class=\"q\">Miért lehet ekkora különbség?\u003c/p>\u003cp>A pénzügyi és adminisztratív digitalizáció sok esetben kézzelfogható előnyt vagy közvetlen kényszert hozott: gyorsabb lett, egyszerűbb, bizonyos esetekben pedig előírások terelték ebbe az irányba a cégeket. A marketing másképpen működik. Ott a vállalkozásnak magának kell felismernie, hogy mitől válik számára értékessé egy digitális eszköz.\u003c/p>\u003cp>Sokszor még mindig eszközökben gondolkodunk. Kell egy új honlap. Kell Facebook. Kell LinkedIn. Kell keresőoptimalizálás. Kell hirdetés. A vevő azonban nem ezekből indul ki. Ő egy problémát akar megoldani. Lehet, hogy keres a Google-ben, ajánlást kér, megnéz néhány céget, elolvas értékeléseket, összehasonlítja a referenciákat, videókat néz, vagy ma már egy mesterségesintelligencia-alapú szolgáltatást kérdez meg. A vállalkozásnak ebben a döntési folyamatban kell jelen lennie.\u003c/p>\u003cp class=\"q\">Tehát a weboldal jelentősége csökken?\u003c/p>\u003cp>Inkább a szerepe változik. Továbbra is nagyon fontos, csak már nem önmagában kell nézni. Korábban leegyszerűsítve úgy működött a folyamat, hogy valaki rákeresett egy szolgáltatásra, eljutott a weboldalra, majd kapcsolatba lépett a céggel. Ma egy potenciális ügyfél sok apró találkozásból állítja össze a véleményét. Lát egy szakmai cikket, találkozik egy közösségimédia-bejegyzéssel, megnézi a Google-értékeléseket, elolvassa a referenciákat, majd lehet, hogy hetekkel később újra rákeres a cégre. Ezek a digitális nyomok együtt alakítják ki, mit gondol a vállalkozásról.\u003c/p>\u003cblockquote>A digitális jelenlét ma már sokkal inkább egymással összekapcsolódó információk, benyomások és bizonyítékok rendszere.\u003c/blockquote>\u003cp class=\"q\">Mit jelent ez egy KKV vezetője számára a gyakorlatban?\u003c/p>\u003cdiv class=\"slot\" data-slot=\"cikk:inart2\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">300 × 250\u003cem>Medium rectangle, in-read\u003c/em>\u003c/span>\u003cspan class=\"ct cd\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad fo fo-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-r\">\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · AI, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct cd\">\u003ca class=\"ad fo fo-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · AI, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cp>Azt, hogy más kérdéseket érdemes feltennie. Nem azt, hogy van-e weboldalunk, hanem azt, hogy megtalálnak-e bennünket akkor, amikor szükség van arra, amit kínálunk. Nem azt, hogy hány látogatónk van, hanem hogy kik érkeznek, milyen problémával és mit tesznek utána. Nem pusztán azt, hogy rendszeresen posztolunk-e, hanem azt, hogy a tartalmaink segítik-e a lehetséges ügyfelet a vásárlási döntésében.\u003c/p>\u003cp>A digitális jelenlét akkor kezd valódi üzleti eszközzé válni, amikor kapcsolatot teremt egy konkrét vevő helyzete és a vállalkozás megoldása között. Ez azért is lényeges, mert a láthatóság önmagában félrevezető lehet: egy cégnek például lehet tízezer honlaplátogatója úgy, hogy alig érkezik értékes megkeresés. Egy másiknak lehet néhány száz látogatója, de ha ők pontosan azt a speciális szolgáltatást keresik, amelyet a cég nyújt, az üzleti eredmény sokkal jobb lehet. Nem feltétlenül a figyelem mennyisége, hanem a relevanciája a döntő.\u003c/p>\u003cp class=\"q\">A mesterséges intelligencia mennyiben változtat ezen?\u003c/p>\u003cp>Jelentősen. Eddig elsősorban arra kellett figyelnünk, hogy egy ember megtalálja és megértse a vállalkozást. Most megjelent egy új közvetítő réteg is. Egyre többen kérdeznek AI-alapú keresőket és asszisztenseket arról, milyen szolgáltatást válasszanak, milyen cégek jöhetnek szóba, vagy mire érdemes figyelniük egy döntésnél. Ez új követelményt jelent. Nem elég, hogy egy weboldal önmagában szép: a vállalkozásról elérhető információnak pontosnak, következetesnek és bizonyíthatónak kell lennie. Egyértelműen ki kell derülnie, mivel foglalkozik a cég, milyen problémákat old meg, kik számára releváns, milyen tapasztalata van, és milyen referenciák támasztják ezt alá.\u003c/p>\u003cp>Fontos kiemelni, hogy ebben a kisebb vállalkozásoknak is komoly lehetőségük van. Egy KKV nem tud mindenben nagyobb lenni egy multinacionális cégnél, de egy szűk szakterületen lehet pontosabb, érthetőbb, gyorsabb és relevánsabb.\u003c/p>\u003cdiv class=\"slot\" data-slot=\"cikk:video\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">320 × 180\u003cem>Videó 16:9\u003c/em>\u003c/span>\u003cspan class=\"ct\">720 × 405\u003cem>Videó 16:9\u003c/em>\u003c/span>\u003cspan class=\"cd\">800 × 450\u003cem>Videó 16:9\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"vid\">\u003cdiv class=\"vid-scene\">\u003cdiv class=\"vid-title\">\u003cspan class=\"vid-kick\">Videópodcast, 3. rész\u003c/span>\u003cb>Német piac, magyar termék: hogyan jut be egy KKV?\u003c/b>\u003cspan class=\"vid-guest\">Vendég: Szabó Balázs exportmenedzser\u003c/span>\u003cspan class=\"vid-cta\">Teljes epizód\u003c/span>\u003c/div>\u003cdiv aria-hidden=\"true\" class=\"vid-set\">\u003cspan class=\"vid-av a1\">KD\u003c/span>\u003cspan class=\"vid-av a2\">SB\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"vid-badge\">Hirdetés\u003c/span>\u003cspan class=\"vid-brand\">\u003csvg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"2.2\" viewBox=\"0 0 24 24\">\u003cpath d=\"M2 17c4-8 16-8 20 0M6 17v-4M12 17v-6M18 17v-4M2 17h20\">\u003c/path>\u003c/svg>ExportHíd\u003c/span>\u003cbutton aria-label=\"Hirdetés lejátszása\" class=\"vid-big\" type=\"button\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M6 3.5v17l15-8.5z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\u003cbutton class=\"vid-skip\" disabled=\"\" type=\"button\">Kihagyható 5 mp múlva\u003c/button>\u003cdiv class=\"vid-ctrl\">\u003cbutton aria-label=\"Lejátszás vagy szünet\" class=\"vid-pp\" type=\"button\">\u003csvg class=\"i-play\" viewBox=\"0 0 24 24\">\u003cpath d=\"M8 5.5v13l11-6.5z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003csvg class=\"i-pause\" viewBox=\"0 0 24 24\">\u003cpath d=\"M7 5h3.5v14H7zM13.5 5H17v14h-3.5z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\u003cspan class=\"vid-bar\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"vid-time\">0:00 / 0:30\u003c/span>\u003cbutton aria-label=\"Hang be vagy ki\" class=\"vid-mute\" type=\"button\">\u003csvg class=\"i-off\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 9v6h4l5 4V5L7 9z\" fill=\"currentColor\" stroke=\"none\">\u003c/path>\u003cpath d=\"M16 9l5 6M21 9l-5 6\">\u003c/path>\u003c/svg>\u003csvg class=\"i-on\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 9v6h4l5 4V5L7 9z\" fill=\"currentColor\" stroke=\"none\">\u003c/path>\u003cpath d=\"M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"q\">Vagyis nem feltétlenül több marketingre lenne szükség?\u003c/p>\u003cp>Sok esetben éppen ez az egyik félreértés. Nem biztos, hogy több poszt, több hirdetés vagy több tartalom kell. Mindenekelőtt pontosabban kell látni, kik a valóban fontos ügyfelek, milyen helyzetekben kezdenek megoldást keresni, milyen bizonytalanságaik vannak, és milyen információ szükséges ahhoz, hogy tovább tudjanak lépni. Ha ezt nem tudjuk, akkor a digitális marketing könnyen folyamatos tartalomgyártássá és médiavásárlássá válik — egyfajta digitális tartalomgyártó „rabszolgává” válunk. Ha viszont értjük a vevő döntési helyzetét, akkor a weboldal, a kereső, a közösségi média, a videó, a szakmai cikk és akár az értékesítő munkája is ugyanannak a rendszernek a részévé válik.\u003c/p>\u003cp class=\"q\">Mi lehet akkor a magyar KKV-k következő nagy digitális feladata?\u003c/p>\u003cp>Az Európai Unió célja, hogy 2030-ra a KKV-k több mint 90 százaléka érje el legalább az alapvető digitális intenzitási szintet. 2025-ben az uniós KKV-k 71 százaléka tartozott ebbe a körbe. A technológiai fejlődés tehát biztosan folytatódik. Szerintem azonban a következő nagy kérdés már nem egyszerűen az lesz, hány digitális rendszert használ egy vállalkozás, hanem az, hogy ezek hogyan járulnak hozzá az üzleti eredményhez.\u003c/p>\u003cp>A magyar KKV-k következő digitalizációs feladata ezért nem feltétlenül egy újabb platform bevezetése vagy egy újabb weboldal elkészítése. Sokkal inkább az, hogy a vállalkozás a digitális jelenlétet az értékesítési rendszere részeként kezelje. A vállalkozásnak ott kell jelen lennie, ahol a vevő tájékozódik, akkor kell érthető választ adnia, amikor a kérdés megszületik, majd annyi bizonyítékot kell felmutatnia, amennyi a következő lépéshez szükséges.\u003c/p>\u003cblockquote>Ma már szinte minden vállalkozás hagy valamilyen nyomot az interneten. A verseny ezért egyre kevésbé arról szól, hogy ki van fent a digitális térben — sokkal inkább arról, hogy kit vesznek észre, kit értenek meg, és végül kiben bíznak meg.\u003c/blockquote>\u003c/div>\u003cdiv class=\"backlinks\">\u003ca class=\"more\" data-p=\"gazdasag\">← Gazdaság rovat\u003c/a>\u003ca class=\"more\" data-p=\"hirek\">Friss a portálon\u003c/a>\u003c/div>\u003c/article>\u003caside>\u003cdiv class=\"slot\" data-slot=\"cikk:side2\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm ct cd\">300 × 250\u003cem>Medium rectangle\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm ct cd\">\u003ca class=\"ad pb pb-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pb-arcs\">\u003c/span>\u003cspan class=\"pb-logo\">\u003csvg viewBox=\"0 0 24 24\">\u003crect fill=\"#d4f36a\" height=\"24\" rx=\"6\" width=\"24\">\u003c/rect>\u003cpath d=\"M4 15c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003cpath d=\"M4 10c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" opacity=\".5\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003c/svg>Pannonhitel\u003c/span>\u003cb class=\"pb-h\">Fix kamat.\u003cbr/>A futamidő végéig.\u003c/b>\u003cspan class=\"pb-sub\">KKV Beruházási Hitel\u003cbr/>5–150 millió forintig\u003c/span>\u003cspan class=\"pb-cta\">Kiszámolom\u003c/span>\u003cspan class=\"pb-legal\">Tájékoztató jellegű, nem minősül ajánlattételnek.\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Hivatkozott források\u003c/h4>\u003cul>\u003cli>\u003cspan>Digiméter 2024 — sajtóközlemény\u003c/span>\u003c/li>\u003cli>\u003cspan>Európai Bizottság — Magyarország 2026-os digitális évtized országjelentése\u003c/span>\u003c/li>\u003cli>\u003cspan>Eurostat — közösségimédia-használat a vállalkozásoknál\u003c/span>\u003c/li>\u003cli>\u003cspan>Eurostat — Digitalisation 2026\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>További anyagaink\u003c/h4>\u003cul>\u003cli>\u003cspan data-p=\"cikk\">Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\u003c/span>\u003c/li>\u003cli>\u003cspan data-p=\"cikk\">Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\u003c/span>\u003c/li>\u003cli>\u003cspan data-p=\"cikk\">Európa-élményközpont Budapest szívében\u003c/span>\u003c/li>\u003cli>\u003cspan data-p=\"cikk\">Az Európai Parlament kapcsolattartó irodái\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Témák\u003c/h4>\u003cdiv class=\"tags\">\u003cspan>digitalizáció\u003c/span>\u003cspan>KKV\u003c/span>\u003cspan>online marketing\u003c/span>\u003cspan>mesterséges intelligencia\u003c/span>\u003cspan>értékesítés\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"wg bo />\u003cspan>Ön is látja.\u003c/span>\u003c/b>\u003cspan class=\"ml-sub\">Felhőalapú könyvelés és pénzügyi áttekintés kis- és középvállalkozásoknak, valós időben.\u003c/span>\u003cspan class=\"ml-dash\">\u003cspan class=\"ml-dl\">Pénzforgalom, szeptember\u003c/span>\u003cspan class=\"ml-dv\">+2,4 M Ft\u003c/span>\u003cspan class=\"ml-bars\">\u003ci style=\"--h:38%\">\u003c/i>\u003ci style=\"--h:52%\">\u003c/i>\u003ci style=\"--h:44%\">\u003c/i>\u003ci style=\"--h:66%\">\u003c/i>\u003ci style=\"--h:58%\">\u003c/i>\u003ci style=\"--h:88%\">\u003c/i>\u003c/span>\u003cspan class=\"ml-warn\">3 kimenő számla lejárt, emlékeztető kiküldve\u003c/span>\u003c/span>\u003cspan class=\"ml-list\">\u003cspan>NAV Online Számla kapcsolat\u003c/span>\u003cspan>Automatikus banki import\u003c/span>\u003cspan>Hozzáférés a könyvelőjének\u003c/span>\u003c/span>\u003cspan class=\"ml-cta\">30 napig ingyen kipróbálom\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">Partnereink ajánlják\u003c/p>\u003cdiv class=\"slot-fl\" data-slot=\"cikk:native\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"live-w\" data-h=\"row\">–\u003c/span>\u003c/span>\u003c/div>\u003ca class=\"ad natw nat-row\">\u003cspan class=\"ph\">\u003csvg preserveAspectRatio=\"xMidYMid slice\" viewBox=\"0 0 320 180\">\u003crect fill=\"#ffc862\" height=\"180\" width=\"320\">\u003c/rect>\u003crect fill=\"#e9ad4f\" height=\"62\" width=\"320\" y=\"118\">\u003c/rect>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" r=\"26\">\u003c/circle>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" fill-opacity=\".3\" r=\"38\">\u003c/circle>\u003cpolygon fill=\"#26435e\" points=\"40,172 110,112 290,112 250,172\">\u003c/polygon>\u003cg fill=\"none\" stroke=\"#8fb3d6\" stroke-width=\"1.3\">\u003cpath d=\"M86.7 132H276.7M63.3 152H263.3M82 172L146 112M124 172L182 112M166 172L218 112M208 u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · mesterséges intelligencia, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-note\">Kedvezményes jegyek\u003cbr/>október 15-ig\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>","p:magazin-story":"\u003cdiv class=\"p-hero\">\u003cspan class=\"im\">\u003cimg alt=\"Kézfogás egy hídon a Duna felett\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/sikerre-alapozva-1200.webp\"/>\u003c/span>\u003c/div>\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Magazin story\u003c/p>\u003ch1 class=\"p-h1\">EUGM Story\u003c/h1>\u003cp class=\"p-desc\">Építjük a magyarországi vállalkozói világ közösségét — 1989 óta.\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"prose\">\u003cp class=\"kick\">A kezdetektől napjainkig\u003c/p>\u003ch2>Építjük a magyarországi vállalkozói világ közösségét!\u003c/h2>\u003cp>Magazinunk 1989-ben, a rendszerváltás küszöbén \u003cb>Új Gazdasági Magazin\u003c/b> néven lett alapítva. Az indulási stratégia fő feladatának tartotta a műszaki fejlesztési eredmények, az új módszerek, eljárások, korszerű termékek és szolgáltatások, továbbá az újonnan alakult vagy átalakult cégek bemutatását.\u003c/p>\u003cp>A vállalt feladatai közé tartozott a gazdálkodó egységek közötti információcsere gyorsítása is. Nagy örömünkre szolgált, hogy az akkori vállalkozások körében rövid idő alatt elismert és kedvelt médiamegoldásként tudtuk megjelentetni a magazint.\u003c/p>\u003ch2>2004 — Európa itt van, és mi is Európában vagyunk\u003c/h2>\u003cp>Magyarország 2004-ben csatlakozott az Európai Unióhoz, és a teljes jogú tagoknak járó kedvezményeket is célszerű volt kommunikálni. Ebből adódóan 2004-ben a magazin elnevezését \u003cb>Új Európai Gazdasági Magazin\u003c/b> névre változtattuk.\u003c/p>\u003cp>Mivel változó világban éltünk — és ez jelenleg is jellemző —, mi is fejlesztettük a tartalmi megoldásainkat, és elkezdtünk a public relations eszközeire is támaszkodni.\u003c/p>\u003ch2>A digitalizáció útján\u003c/h2>\u003cp>A digitalizáció jegyében szélesítettük a magazin megjelenésének megoldásait: a nyomtatott magazin mellett megjelentettük az online változatot. Ez egy akkor úttörő megoldásként egyfajta lapozható változatban valósult meg. Így lehetőségünk nyílt egy e-mail megoldással támogatni a megjelenést, és perszonalizált formában tudtuk tájékoztatni az olvasókat a magazin megjelenéséről, annak digitális formában való elérhetőségeiről.\u003c/p>\u003cblockquote>Ezt a folyamatot kívánjuk jelen időszakban is folytatni oly módon, hogy kapcsolatot teremtettünk a megújult honlapunkkal.\u003c/blockquote>\u003cp>A \u003cb>Demján Sándor\u003c/b> nevével fémjelzett fejlesztési pályázaton fejlesztési támogatást nyertünk, és így sikerült egy korszerű portál megvalósítása. Ez a portál széles körű információkat képes kommunikálni a gazdaság szereplői felé, és lehetőségünk van a folyamatos fejlesztésre is.\u003c/p>\u003ch2>Az archívum mint érték\u003c/h2>\u003cp>A magazin több mint három évtizede dokumentálja a magyar vállalkozói világ változásait. Ez az anyag ma már önmagában is érték: a lapszámok együtt olvasva megmutatják, hogyan alakult át a hazai gazdaság nyelve és kérdésfeltevése az uniós csatlakozástól a digitális szemléletváltásig.\u003c/p>\u003cp>Ezért a portálon a korábbi lapszámok nem mellékletek, hanem önálló tartalom: teljes terjedelmükben lapozhatók, és téma szerint is kereshetők — de a régi anyagok nem keverednek a portál mai írásaival. A múlt azt mutatja meg, honnan jöttünk; a jelen írásai a Vállalkozóihíd szellemében készülnek.\u003c/p>\u003ch2>Tartalmi stratégiánk iránya\u003c/h2>\u003cp>Tartalmi stratégiánk fejlesztése során meghatározó szerepet kívánunk szánni az uniós vetületet érintő információknak, beleértve a fejlesztési támogatások lehetőségeinek megismertetését is.\u003c/p>\u003cp>A gazdasági folyamatok egyre szükségesebbé teszik a vállalkozások \u003cem>digitális szemléletváltásának\u003c/em> a megvalósítását. Ennek szellemében terveink szerint elindítjuk \u003cb>eugmonline\u003c/b> hírlevelezési szolgáltatásunkat is. A hírlevelek a magazin és a portál objektív, releváns tartalmi anyagaira támaszkodva fognak egy interaktív kommunikációs csatornát képezni.\u003c/p>\u003cblockquote>A rendszerváltási időszakban aktuális volt, és napjainkban is aktuális gondolat: „merjetek nagyot álmodni”.\u003c/blockquote>\u003c/div>\u003cdiv class=\"portrait\">\u003cspan class=\"im\">\u003cimg alt=\"Óvári László\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/ovari-laszlo-320.webp\"/>\u003c/span>\u003cdiv>\u003cb>Óvári László\u003c/b>\u003cspan>alapító-főszerkesztő\u003c/span>\u003c/div>\u003cp>„… napjainkban is aktuális gondolat: merjetek nagyot álmodni.”\u003c/p>\u003c/div>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>Mérföldkövek\u003c/h4>\u003cdl>\u003cdt>1989\u003c/dt>\u003cdd>alapítás Új Gazdasági Magazin néven\u003c/dd>\u003cdt>2004\u003c/dt>\u003cdd>névváltás, európai fókusz\u003c/dd>\u003cdt>2010-es évek\u003c/dt>\u003cdd>lapozható online kiadás\u003c/dd>\u003cdt>2026\u003c/dt>\u003cdd>új portál a Demján Sándor Program támogatásával\u003c/dd>\u003c/dl>\u003c/div>\u003cdiv class=\"slot\" data-slot=\"magazin-story:side2\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm ct cd\">300 × 250\u003cem>Medium rectangle\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm ct cd\">\u003ca class=\"ad pr pr-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pr-radar r-l\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-name\">PályázatRadar Pro\u003c/span>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan class=\"pr-sub\">24 órán belül értesítjük, szakértői összefoglalóval.\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Elérhetőségeink\u003c/h4>\u003cul>\u003cli>\u003cspan>eugm.hu\u003c/span>\u003c/li>\u003cli>\u003cspan>ujeuropaigazdasagimagazin.hu\u003c/span>\u003c/li>\u003cli>\u003cspan>ujeuropaigazdasagimagazin.eu\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>Vállalkozóihíd\u003c/h4>\u003cp>A magazin kiemelt projektje: kommunikációs híd a KKV-k, a nagyvállalatok és a döntéshozók között — és a vállalkozók között egymással.\u003c/p>\u003ca class=\"more\" data-p=\"vallalkozoihid\">A Vállalkozóihídról\u003c/a>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>\u003cdiv class=\"s-slot wrap\">\u003cdiv class=\"slot\" data-slot=\"magazin-story:foot\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">320 × 100\u003cem>Nagy mobil banner\u003c/em>\u003c/span>\u003cspan class=\"ct\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003cspan class=\"cd\">970 × 90\u003cem>Super leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad fo fo-mb\" style=\"width:320px;height:100px\">\u003cspan class=\"fo-date\">\u003csmall>nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>2026\u003c/small>\u003c/span>\u003cspan class=\"fo-r\">\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest, 30 előadó\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct\">\u003ca class=\"ad fo fo-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · AI, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"cd\">\u003ca class=\"ad fo fo-lb\" style=\"width:970px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · mesterséges intelligencia, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-note\">Kedvezményes jegyek\u003cbr/>október 15-ig\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>","p:magazin":"\u003cdiv class=\"p-hero\">\u003cspan class=\"im\">\u003cimg alt=\"Az Új Európai Gazdasági Magazin lapszámai és borítói\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/hero-magazin-1200.webp\"/>\u003c/span>\u003c/div>\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / A lap múltja\u003c/p>\u003ch1 class=\"p-h1\">A lap múltja\u003c/h1>\u003cp class=\"p-desc\">Néhány mérföldkő és néhány eredeti lapszám arról, honnan jött az Új Európai Gazdasági Magazin — és miért érdemes ma is odafigyelni rá.\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"s-slot wrap plain\">\u003cdiv class=\"slot-fl\" data-slot=\"magazin:sponsor\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"live-w\" data-h=\"96|64\">–\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"ad sp\">\u003cspan class=\"sp-lbl\">Az archívum támogatója\u003c/span>\u003cspan class=\"sp-logo\">\u003csvg viewBox=\"0 0 24 24\">\u003crect fill=\"#d4f36a\" height=\"24\" rx=\"6\" width=\"24\">\u003c/rect>\u003cpath d=\"M4 15c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003cpath d=\"M4 10c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" opacity=\".5\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003c/svg>Pannonhitel\u003c/span>\u003cspan class=\"sp-txt\">Finanszírozás magyar vállalkozásoknak.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap tight\">\u003cdiv class=\"stats\">\u003cdiv>\u003cb>1989\u003c/b>\u003cspan>alapítás éve\u003c/span>\u003c/div>\u003cdiv>\u003cb>XXXVIII.\u003c/b>\u003cspan>évfolyam\u003c/span>\u003c/div>\u003cdiv>\u003cb>2004\u003c/b>\u003cspan>óta európai fókusz\u003c/span>\u003c/div>\u003cdiv>\u003cb>2026\u003c/b>\u003cspan>a digitális lendület éve\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">Mérföldkövek\u003c/p>\u003ch2 class=\"h2\">Négy évtized, négy fordulópont\u003c/h2>\u003cp class=\"intro\">Egy gazdasági lap hitelét nem az adja, hogy mit ígér, hanem hogy mennyi ideje van jelen. Ez az oldal nem teljes archívum: néhány mérföldkő és néhány eredeti lapszám, bizonyítéknak.\u003c/p>\u003cdiv class=\"miles\">\u003cdiv>\u003cb>1989\u003c/b>\u003ch3>Alapítás\u003c/h3>\u003cp>A lap a rendszerváltás küszöbén indult Új Gazdasági Magazin néven, a műszaki fejlesztések és az újonnan alakult cégek bemutatásával.\u003c/p>\u003c/div>\u003cdiv>\u003cb>2004\u003c/b>\u003ch3>Európai fókusz\u003c/h3>\u003cp>Az uniós csatlakozás évétől a lap neve és iránya is megváltozott: az európai gazdasági információ magyar nyelvű közvetítése lett a feladat.\u003c/p>\u003c/div>\u003cdiv>\u003cb>XXXVIII.\u003c/b>\u003ch3>Évfolyam\u003c/h3>\u003cp>A magazin azóta is folyamatosan megjelenik — nyomtatásban a döntéshozói listára, digitálisan a vállalkozói körnek.\u003c/p>\u003c/div>\u003cdiv>\u003cb>2026\u003c/b>\u003ch3>Digitális lendület\u003c/h3>\u003cp>A portál indulásával a lap a digitális szemléletváltás kommunikációs partnere lesz, a nyomtatott kiadás mellett.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap alt\">\u003cdiv class=\"issue\">\u003cspan class=\"im\" style=\"aspect-ratio:210/297;display:grid;place-items:center;font-size:13px;color:#5f6a7c\">Borító készül\u003c/span>\u003cdiv>\u003cp class=\"kick\">Készülő kiadás\u003c/p>\u003ch4>Visszatekintő szám\u003c/h4>\u003cdiv class=\"prose\">\u003cp>32–40 oldalas válogatás a magazin évtizedeiből, témák szerint rendezve, mai szerkesztői bevezetőkkel. A szám egyszerre mutatja meg, hogyan változott a hazai vállalkozói világ, és hogyan írt róla a lap.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap\">\u003ch2 class=\"h2\">Eredeti lapszámok, bizonyítéknak\u003c/h2>\u003cp class=\"intro\">Néhány lapszám az eredeti nyomtatott tördelésben, lapozható formában. Archív anyagok: a megjelenésük idejének állapotát tükrözik, nem a mai szerkesztőségi álláspontot.\u003c/p>\u003ch3 class=\"kick\" style=\"font-size:15px\">A digitalizáció évtizede\u003c/h3>\u003cdiv class=\"issues\">\u003cdiv class=\"issue\">\u003ca data-p=\"lapozo\">\u003cspan class=\"im\">\u003cimg alt=\"A(z) 2018. november lapszám borítója\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/lapszamok/2018-11/borito.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003ch4 data-p=\"lapozo\">2018. november\u003c/h4>\u003csmall>XXX. évfolyam\u003c/small>\u003cp>Digitális lendület: a Modern Vállalkozások Programja, a CSR és a vállalkozói digitalizáció gyakorlata.\u003c/p>\u003csmall>53 oldal · 6 kiemelt írás\u003c/small>\u003ca class=\"more\" data-p=\"lapozo\">Lapozom\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"issue\">\u003ca data-p=\"lapozo\">\u003cspan class=\"im\">\u003cimg alt=\"A(z) 2016. december – január lapszám borítója\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/lapszamok/2016-12/borito.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003ch4 data-p=\"lapozo\">2016. 3c/span>\u003cem>13. oldal\u003c/em>\u003c/li>\u003cli>\u003cb>Az égre festett csodavilág\u003c/b>\u003cspan>Tóth Ferenc, NÚVU Kft.\u003c/span>\u003cem>49. oldal\u003c/em>\u003c/li>\u003c/ul>\u003cp class=\"note\">A teljes lapszám PDF-ben is letölthető (2,0 MB).\u003c/p>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>A lapszám adatai\u003c/h4>\u003cdl>\u003cdt>Évfolyam\u003c/dt>\u003cdd>XXX. évfolyam\u003c/dd>\u003cdt>Megjelenés\u003c/dt>\u003cdd>2018. november\u003c/dd>\u003cdt>Terjedelem\u003c/dt>\u003cdd>53 oldal\u003c/dd>\u003cdt>ISSN\u003c/dt>\u003cdd>0865-9813\u003c/dd>\u003c/dl>\u003c/div>\u003cdiv class=\"slot\" data-slot=\"lapozo:side2\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm ct cd\">300 × 250\u003cem>Medium rectangle\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm ct cd\">\u003ca class=\"ad pr pr-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pr-radar r-l\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-name\">PályázatRadar Pro\u003c/span>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan class=\"pr-sub\">24 órán belül értesítjük, szakértői összefoglalóval.\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Olvasási tippek\u003c/h4>\u003cul>\u003cli>\u003cspan>← → billentyűkkel lapozhat\u003c/span>\u003c/li>\u003cli>\u003cspan>Kattintson az oldal szélére\u003c/span>\u003c/li>\u003cli>\u003cspan>Mobilon húzza el ujjal\u003c/span>\u003c/li>\u003cli>\u003cspan>Az Oldalak gombbal indexképeket kap\u003c/span>\u003c/li>\u003cli>\u003cspan>A Teljes képernyő a legjobb olvasási élmény\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>További lapszámok\u003c/h4>\u003cp>A magazin 1989 óta jelenik meg. Az archívum digitalizálása folyamatos.\u003c/p>\u003ca class=\"btn ghost\" data-p=\"magazin\">Lapszámarchívum\u003c/a>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>","p:uzleti-partnerinfo":"\u003cdiv class=\"p-hero\">\u003cspan class=\"im\">\u003cimg alt=\"Íróasztal a magazinnal, laptoppal és földgömbbel\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/hero-partnerinfo-1200.webp\"/>\u003c/span>\u003c/div>\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Üzleti partnerinfó\u003c/p>\u003ch1 class=\"p-h1\">Üzleti partnerinfó\u003c/h1>\u003cp class=\"p-desc\">Megjelenési lehetőségek a döntéshozói asztalon és a vállalkozói postaládában.\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">Miért az EUGM?\u003c/p>\u003ch2 class=\"h2\">Egy célzott médium, amely nem a tömeget, hanem a döntéshozót éri el\u003c/h2>\u003cp class=\"intro\">A magazin V.I.P. céges listára, perszonalizált levél kíséretében jut el a kormányzati, minisztériumi és nagyvállalati vezetőkhöz — miközben a digitális kiadás és a portál a teljes KKV-szektor felé nyit.\u003c/p>\u003cdiv class=\"feat f4\">\u003cdiv>\u003ch3>Célzott terjesztés\u003c/h3>\u003cp>Névre szóló, ablakos borítékos kézbesítés a döntéshozói listára.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>37+ év hitelesség\u003c/h3>\u003cp>1989 óta a hazai gazdasági élet folyamatos szereplője.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Kettős csatorna\u003c/h3>\u003cp>Nyomtatott presztízs és mérhető digitális elérés egy csomagban.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Szerkesztett tartalom\u003c/h3>\u003cp>PR-cikk és interjú a magazin szerkesztőségi minőségében.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">Megjelenési formák\u003c/p>\u003ch2 class=\"h2\">Amiből választhat\u003c/h2>\u003cdiv class=\"feat f3\">\u003cdiv>\u003ch3>Hirdetési felület\u003c/h3>\u003cp>Egész, fél és negyed oldalas hirdetési felületek a nyomtatott és a digitális kiadásban, kiemelt borítóoldali pozíciókkal.\u003c/p>\u003cul>\u003cli>B2, B3, B4 borítóoldalak\u003c/li>\u003cli>Belíves egész és fél oldal\u003c/li>\u003cli>Rovathoz kötött elhelyezés\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch3>PR-cikk és interjú\u003c/h3>\u003cp>Szerkesztőségi minőségben készülő vállalatbemutató, vezetői interjú vagy esettanulmány — a magazin hangvételében.\u003c/p>\u003cul>\u003cli>Vezetői interjú (2–4 oldal)\u003c/li>\u003cli>Cégbemutató és esettanulmány\u003c/li>\u003cli>Fotózás és szövegírás igény szerint\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch3>Portál és hírlevél\u003c/h3>\u003cp>Online cikkmegjelenés, banner-pozíciók a portálon, valamint kiemelés az eugmonline hírlevélben.\u003c/p>\u003cul>\u003cli>Portálcikk saját aloldallal\u003c/li>\u003cli>Banner a rovatoldalakon\u003c/li>\u003cli>Hírlevélbeli kiemelés\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"house\">\u003ch4>Online megjelenés a portálon\u003c/h4>\u003cp>A portál saját hirdetési felületei, töréspontonként külön méretben. Ez házi tartalom, nem külső hirdetési hely.\u003c/p>\u003cul>\u003cli>Branding tapéta 1920 × 1080\u003c/li>\u003cli>Rovatfejléc 970 × 250\u003c/li>\u003cli>Oldalsáv 300 × 600\u003c/li>\u003cli>Videó 16:9\u003c/li>\u003cli>Podcast-kártya 300 × 250\u003c/li>\u003cli>Natív cikk\u003c/li>\u003cli>Rovattámogatás\u003c/li>\u003cli>Mobil horgony 320 × 50\u003c/li>\u003c/ul>\u003c/div>\u003cp class=\"note\">A megjelenési megállapodásokat a szerkesztőség minden partnerrel egyedileg köti, a célközönség és a kampány jellege szerint.\u003c/p>\u003c/section>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">Megjelenési formáink\u003c/p>\u003ch2 class=\"h2\">Két csatorna, egy célközönség\u003c/h2>\u003cdiv class=\"feat f2\">\u003cdiv>\u003ch3>Exkluzív nyomtatott magazin\u003c/h3>\u003cp>V.I.P. céges listára, ablakos borítékban, perszonalizált levél kíséretében, térítésmentesen kerül kézbesítésre a döntéshozók részére.\u003c/p>\u003cul>\u003cli>Kormányzati és minisztériumi vezetők\u003c/li>\u003cli>Irányító hatóságok döntéshozói\u003c/li>\u003cli>Nagyvállalati felsővezetők\u003c/li>\u003cli>Kamarai és érdekképviseleti vezetők\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch3>Digitális, lapozható változat\u003c/h3>\u003cp>Szerverre telepített, lapozható e-változat, amelyet perszonalizált e-mailben kapnak meg olvasóink.\u003c/p>\u003cul>\u003cli>Azonnali elérhetőség bárhonnan\u003c/li>\u003cli>Cikkenkénti önálló oldal és kereshetőség\u003c/li>\u003cli>Kiterjesztett elérés a KKV-szektor felé\u003c/li>\u003cli>Mérhető olvasottság és átkattintás\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">Kinek szól\u003c/p>\u003ch2 class=\"h2\">Olvasóink köre\u003c/h2>\u003cdiv class=\"feat f3\">\u003cdiv>\u003ch3>Kormányzat és hatóságok\u003c/h3>\u003cp>Minisztériumi vezetők és az irányító hatóságok döntéshozói.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Nagyvállalati felsővezetők\u003c/h3>\u003cp>Ügyvezetők, beszerzési és stratégiai területek vezetői.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>KKV-k és egyéni vállalkozók\u003c/h3>\u003cp>A digitális kiadás és a hírlevél kiterjesztett elérésén keresztül.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">Egyeztetés\u003c/p>\u003ch2 class=\"h2\">Beszéljük meg, mire van szüksége\u003c/h2>\u003cp class=\"intro\">Írja meg, milyen célközönséget szeretne elérni, és a szerkesztőség személyre szabott javaslatot készít a megjelenésre.\u003c/p>\u003cp class=\"intro\">Telefon: +36 (70) 905 0049\u003cbr/>E-mail: info@magazinpress.hu\u003c/p>\u003ca class=\"btn\" data-p=\"kapcsolat\">Kapcsolatfelvétel →\u003c/a>\u003c/section>","p:kapcsolat":"\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Kapcsolat\u003c/p>\u003ch1 class=\"p-h1\">Kapcsolat\u003c/h1>\u003cp class=\"p-desc\">Írjon nekünk — a szerkesztőség munkanapokon válaszol.\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cp class=\"kick\">Üzenetküldés\u003c/p>\u003ch2 class=\"h2\">Miben segíthetünk?\u003c/h2>\u003cp class=\"intro\">Legyen szó megjelenési ajánlatkérésről, szerkesztőségi témajavaslatról vagy hírlevél-feliratkozásról — töltse ki az űrlapot, és felvesszük Önnel a kapcsolatot.\u003c/p>\u003cdiv class=\"form\">\u003cdiv class=\"row\">\u003clabel>Név *\u003cinput/>\u003c/label>\u003clabel>Cég / szervezet\u003cinput/>\u003c/label>\u003c/div>\u003cdiv class=\"row\">\u003clabel>E-mail cím *\u003cinput type=\"email\"/>\u003c/label>\u003clabel>Telefon\u003cinput/>\u003c/label>\u003c/div>\u003clabel>Megkeresés tárgya\u003cselect>\u003coption>Megjelenés, hirdetés\u003c/option>\u003coption>PR-cikk, interjú javaslata\u003c/option>\u003coption>Szerkesztőségi témajavaslat\u003c/option>\u003coption>Előfizetés, lapszám igénylése\u003c/option>\u003coption>Egyéb\u003c/option>\u003c/select>\u003c/label>\u003clabel>Üzenet *\u003ctextarea>\u003c/textarea>\u003c/label>\u003cdiv class=\"captcha\">CAPTCHA / spamvédelem helye — az éles oldalon aktív\u003c/div>\u003clabel class=\"chk\">\u003cinput type=\"checkbox\"/> Elolvastam és elfogadom az adatkezelési tájékoztatót, és hozzájárulok az adataim kapcsolatfelvétel céljából történő kezeléséhez. *\u003c/label>\u003cdiv>\u003cspan class=\"btn\">Üzenet elküldése\u003c/span>\u003c/div>\u003cp class=\"note\">A *-gal jelölt mezők kitöltése kötelező.\u003c/p>\u003c/div>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>Szerkesztőség\u003c/h4>\u003cdl>\u003cdt>Telefon\u003c/dt>\u003cdd>+36 (70) 905 0049\u003c/dd>\u003cdt>E-mail\u003c/dt>\u003cdd>info@magazinpress.hu\u003c/dd>\u003c/dl>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Kiadó\u003c/h4>\u003cp>Magazin Press\u003cbr/>ISSN 0865-9813 · Alapítva 1989\u003c/p>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>Kövessen minket\u003c/h4>\u003cp>Friss anyagaink a közösségi oldalunkon és a hírlevélben.\u003c/p>\u003ca class=\"btn ghost\" data-p=\"index\">Hírlevél-feliratkozás\u003c/a>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>","p:impresszum":"\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Impresszum\u003c/p>\u003ch1 class=\"p-h1\">Impresszum\u003c/h1>\u003cp class=\"p-desc\">A magazin és a portál kiadói, szerkesztőségi és üzemeltetési adatai.\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"legal\">\u003ch2>A lap adatai\u003c/h2>\u003cul>\u003cli>A lap címe: Új Európai Gazdasági Magazin\u003c/li>\u003cli>Alapítva: 1989 (Új Gazdasági Magazin néven), 2004-től Új Európai Gazdasági Magazin\u003c/li>\u003cli>Évfolyam: XXXVIII. évfolyam\u003c/li>\u003cli>ISSN: 0865-9813\u003c/li>\u003cli>Megjelenés: nyomtatott és lapozható digitális kiadás\u003c/li>\u003c/ul>\u003ch2>Kiadó és szerkesztőség\u003c/h2>\u003cul>\u003cli>Kiadó: Magazin Press\u003c/li>\u003cli>Alapító-főszerkesztő: Óvári László\u003c/li>\u003cli>Telefon: +36 (70) 905 0049\u003c/li>\u003cli>E-mail: info@magazinpress.hu\u003c/li>\u003c/ul>\u003ch2>A weboldal fejlesztése és üzemeltetése\u003c/h2>\u003cul>\u003cli>Fejlesztő: Grafcom Media Kft.\u003c/li>\u003cli>Székhely: 1024 Budapest, Rómer Flóris utca 4.\u003c/li>\u003cli>Képviselő: Magdó Emil\u003c/li>\u003cli>Weboldal: grafcom.hu\u003c/li>\u003c/ul>\u003ch2>Támogatás\u003c/h2>\u003cp>A weboldal a Demján Sándor Program keretében és támogatásával valósult meg, a Neumann János Nonprofit Közhasznú Korlátolt Felelősségű Társaság által kiírt „Minden vállalkozásnak legyen saját honlapja” Program pályázat keretében.\u003c/p>\u003ch2>Nyilvántartási adatok\u003c/h2>\u003cp>A kiadói és szerkesztőségi tevékenységet Óvári László József egyéni vállalkozó végzi. A nyilvántartási adatokat a kiadó adja meg. A kapcsolattartás telefonon és e-mailben történik.\u003c/p>\u003ch2>Tárhelyszolgáltató\u003c/h2>\u003cp>ViaCom Informatikai Kereskedelmi és Szolgáltató Kft. · 2360 Gyál, Deák Ferenc utca 17.\u003c/p>\u003ch2>Szerzői jogok\u003c/h2>\u003cp>A weboldalon megjelenő valamennyi tartalom — szöveg, fotó, grafika, logó és elrendezés — szerzői jogi védelem alatt áll. Felhasználás, másolás, terjesztés vagy átdolgozás kizárólag a kiadó előzetes írásbeli engedélyével lehetséges.\u003c/p>\u003ch2>Felelősség\u003c/h2>\u003cp>A kiadó az információk pontosságáért mindent megtesz, de a felhasználásukból eredő károkért felelősséget nem vállal. A hirdetések és fizetett megjelenések tartalmáért a megrendelő felel. A külső hivatkozások tartalmáért a kiadó nem vállal felelősséget.\u003c/p>\u003ch2>Adatkezelés\u003c/h2>\u003cp>A személyes adatok kezelésének részleteit az \u003ca class=\"more\" data-p=\"adatvedelem\">Adatkezelési tájékoztató\u003c/a> tartalmazza.\u003c/p>\u003c/div>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>Gyors adatok\u003c/h4>\u003cdl>\u003cdt>ISSN\u003c/dt>\u003cdd>0865-9813\u003c/dd>\u003cdt>Alapítva\u003c/dt>\u003cdd>1989\u003c/dd>\u003cdt>Évfolyam\u003c/dt>\u003cdd>XXXVIII. évfolyam\u003c/dd>\u003c/dl>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Elérhetőség\u003c/h4>\u003cul>\u003cli>\u003cspan>+36 (70) 905 0049\u003c/span>\u003c/li>\u003cli>\u003cspan>info@magazinpress.hu\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>Megjelenési lehetőségek\u003c/h4>\u003cp>Hirdetés, PR-cikk, interjú a magazinban és a portálon.\u003c/p>\u003ca class=\"btn ghost\" data-p=\"uzleti-partnerinfo\">Üzleti partnerinfó\u003c/a>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>","p:adatvedelem":"\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Adatkezelési tájékoztató\u003c/p>\u003ch1 class=\"p-h1\">Adatkezelési tájékoztató\u003c/h1>\u003cp class=\"p-desc\">Hatályos: 2026. … · A GDPR és az Infotv. rendelkezései szerint\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv class=\"legal\">\u003cp class=\"draft\">Kitöltendő mezők — a csillaggal jelölt adatokat a szerkesztőségnek kell véglegesítenie az élesítés előtt\u003c/p>\u003ch2>1. A tájékoztató célja\u003c/h2>\u003cp>Az Óvári László József e.v. (a továbbiakban: Adatkezelő) kötelezettséget vállal arra, hogy a tevékenységével kapcsolatos minden adatkezelés megfelel a hatályos nemzeti jogszabályokban, valamint az Európai Unió jogi aktusaiban meghatározott elvárásoknak.\u003c/p>\u003ch2>2. Az adatkezelő adatai\u003c/h2>\u003cul>\u003cli>\u003cb>Név:\u003c/b> Óvári László József e.v.\u003c/li>\u003cli>\u003cb>Székhely:\u003c/b> a szerkesztőség pontosítja\u003c/li>\u003cli>\u003cb>Telefonszám:\u003c/b> +36 (70) 905 0049\u003c/li>\u003cli>\u003cb>E-mail:\u003c/b> info@magazinpress.hu\u003c/li>\u003c/ul>\u003ch2>3. A kezelt személyes adatok köre\u003c/h2>\u003cp>\u003cb>Kapcsolatfelvételi űrlap:\u003c/b> név, e-mail-cím, cég vagy szervezet neve (nem kötelező), telefonszám (nem kötelező), az üzenet szövege.\u003c/p>\u003cp>\u003cb>Hírlevél:\u003c/b> név és e-mail-cím.\u003c/p>\u003cp>\u003cb>Technikai adatok:\u003c/b> a látogató böngészőjére, IP-címére és a meglátogatott oldalakra vonatkozó adatok.\u003c/p>\u003ch2>4. Sütik (cookie-k)\u003c/h2>\u003cp>\u003cb>Szükséges sütik:\u003c/b> a munkamenet végével automatikusan törlődnek.\u003c/p>\u003cp>\u003cb>Analitika:\u003c/b> Google Analytics és Google Tag Manager.\u003c/p>\u003cp>\u003cb>Közösségi média:\u003c/b> Facebook Pixel.\u003c/p>\u003ch2>5. Adattovábbítás, adatfeldolgozás\u003c/h2>\u003cp>Az Adatkezelő a következő adatfeldolgozókat veszi igénybe: ViaCom Informatikai Kereskedelmi és Szolgáltató Kft. (tárhely), Google Ireland Limited, Meta Platforms Ireland Limited, a hírlevélküldő rendszer szolgáltatója, valamint a Grafcom Media Kft. (fejlesztés és üzemeltetés).\u003c/p>\u003ch2>6. Az adatkezelés célja, módja és jogalapja\u003c/h2>\u003cp>Az adatkezelések az érintett önkéntes hozzájárulásán, illetve törvényi felhatalmazáson alapulnak.\u003c/p>\u003ch2>7. Az érintett jogai és jogérvényesítési lehetőségei\u003c/h2>\u003cul>\u003cli>\u003cb>Tájékoztatáshoz való jog:\u003c/b> az Adatkezelő legfeljebb egy hónapon belül válaszol.\u003c/li>\u003cli>\u003cb>Helyesbítéshez való jog:\u003c/b> a pontatlan vagy hiányos adatok módosíthatók.\u003c/li>\u003cli>\u003cb>Törléshez való jog:\u003c/b> az Adatkezelő indokolatlan késedelem nélkül törli az adatokat.\u003c/li>\u003cli>\u003cb>Az adatkezelés korlátozásához való jog\u003c/b>\u003c/li>\u003cli>\u003cb>Adathordozhatósághoz való jog:\u003c/b> az adatok tagolt, széles körben használt, géppel olvasható formátumban kérhetők.\u003c/li>\u003cli>\u003cb>Tiltakozáshoz való jog\u003c/b>\u003c/li>\u003cli>\u003cb>A hozzájárulás visszavonásának joga\u003c/b>\u003c/li>\u003c/ul>\u003ch2>8. Jogorvoslati lehetőségek\u003c/h2>\u003cp>Az érintett bírósághoz fordulhat, vagy panaszt tehet a Nemzeti Adatvédelmi és Információszabadság Hatóságnál (NAIH).\u003c/p>\u003cul>\u003cli>Cím: 1055 Budapest, Falk Miksa utca 9–11.\u003c/li>\u003cli>Telefon: +36 (1) 391-1400\u003c/li>\u003cli>E-mail: ugyfelszolgalat@naih.hu\u003c/li>\u003c/ul>\u003ch2>9. Egyéb rendelkezések\u003c/h2>\u003cp>Az Adatkezelő gondoskodik az adatok biztonságáról: SSL-tanúsítvánnyal, tűzfallal, végpontvédelemmel és webalkalmazás-tűzfallal.\u003c/p>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>Tartalomjegyzék\u003c/h4>\u003cul>\u003cli>\u003cspan>1. A tájékoztató célja\u003c/span>\u003c/li>\u003cli>\u003cspan>2. Az adatkezelő adatai\u003c/span>\u003c/li>\u003cli>\u003cspan>3. A kezelt személyes adatok köre\u003c/span>\u003c/li>\u003cli>\u003cspan>4. Sütik (cookie-k)\u003c/span>\u003c/li>\u003cli>\u003cspan>5. Adattovábbítás, adatfeldolgozás\u003c/span>\u003c/li>\u003cli>\u003cspan>6. Az adatkezelés célja, módja és jogalapja\u003c/span>\u003c/li>\u003cli>\u003cspan>7. Az érintett jogai és jogérvényesítési lehetőségei\u003c/span>\u003c/li>\u003cli>\u003cspan>8. Jogorvoslati lehetőségek\u003c/span>\u003c/li>\u003cli>\u003cspan>9. Egyéb rendelkezések\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>Kérdése van?\u003c/h4>\u003cp>Adatkezeléssel kapcsolatos kérdéseit az alábbi címre várjuk.\u003c/p>\u003cp>info@magazinpress.hu\u003c/p>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>","ftr":"\u003cdiv class=\"dsp\">\u003cspan>A weboldal a Demján Sándor Program keretében és támogatásával valósult meg.\u003c/span>\u003cspan class=\"im contain\">\u003cimg alt=\"Demján Sándor Program logó\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/dsp-logo-feher.png\"/>\u003c/span>\u003cspan class=\"im contain\">\u003cimg alt=\"Neumann János Nonprofit Közhasznú Kft. logó\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/neum-logo-feher.png\"/>\u003c/span>\u003c/div>\u003cfooter class=\"s-ft\">\u003cdiv class=\"ft-grid\">\u003cdiv>\u003cspan class=\"im contain\">\u003cimg alt=\"Új Európai Gazdasági Magazin logó\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/eugm-logo-light.png\"/>\u003c/span>\u003cp>Alapítva 1989-ben. A hazai gazdasági élet meghatározó véleményformálója, amely kommunikációs hidat épít a mikro-, kis- és középvállalkozások, a nagyvállalatok és a gazdaságot irányító döntéshozók között.\u003c/p>\u003cdiv class=\"soc\">\u003cspan>f\u003c/span>\u003cspan>in\u003c/span>\u003cspan>@\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003ch5>Rovatok\u003c/h5>\u003cul>\u003cli>\u003ca data-p=\"gazdasag\">Gazdaság\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"europai-unio\">Európai Unió\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"vallalkozoihid\">Vállalkozóihíd\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"digitalis-lendulet\">Digitális lendület\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"gm-elet\">GmÉlet\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"hirek\">Hírek\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch5>A magazinról\u003c/h5>\u003cul>\u003cli>\
