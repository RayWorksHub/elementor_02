stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003c/svg>Pannonhitel\u003c/span>\u003cspan class=\"pb-txt\">\u003cb>Fix kamat a futamidő végéig\u003c/b>\u003cspan>KKV Beruházási Hitel 5–150 millió forintig\u003c/span>\u003c/span>\u003cspan class=\"pb-cta\">Kiszámolom\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap tight\">\u003cdiv class=\"viewer\">\u003cdiv class=\"vw-bar\">\u003cspan>2018. november · 1 / 53\u003c/span>\u003cspan>\u003ci>Oldalak\u003c/i>\u003ci>Teljes képernyő\u003c/i>\u003c/span>\u003c/div>\u003cdiv class=\"vw-stage\">\u003cspan class=\"arr\">‹\u003c/span>\u003cdiv class=\"vw-spread\">\u003cspan class=\"im\">\u003cimg alt=\"A 2018. november lapszám borítója\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/lapszamok/2018-11/borito.webp\"/>\u003c/span>\u003cspan class=\"pg\">2. oldal\u003c/span>\u003c/div>\u003cspan class=\"arr\">›\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cp class=\"kick\">Ebben a lapszámban\u003c/p>\u003ch2 class=\"h2\">Tartalom\u003c/h2>\u003cp class=\"intro\">A címre kattintva az olvasó a megfelelő oldalon nyílik meg. A lapszám az eredeti nyomtatott tördelésben látható — archív anyag, a megjelenés idejének állapotát tükrözi.\u003c/p>\u003cul class=\"toc\">\u003cli>\u003cb>Digitális lendület\u003c/b>\u003cspan>Vezércikk\u003c/span>\u003cem>2. oldal\u003c/em>\u003c/li>\u003cli>\u003cb>PM–KKVHÁZ: a kávéház\u003c/b>\u003cspan>Gulyás József, KKVHÁZ Zrt.\u003c/span>\u003cem>4. oldal\u003c/em>\u003c/li>\u003cli>\u003cb>CSR — a lehetséges sorvezető\u003c/b>\u003cspan>Takács Júlia, CSR Hungary\u003c/span>\u003cem>5. oldal\u003c/em>\u003c/li>\u003cli>\u003cb>A Modern Vállalkozások Programja\u003c/b>\u003cspan>Digitálisan Felkészült Vállalkozás\u003c/span>\u003cem>11. oldal\u003c/em>\u003c/li>\u003cli>\u003cb>Ne a munkád ossza be az időd\u003c/b>\u003cspan>iMarketing\u003c/span>\u003cem>13. oldal\u003c/em>\u003c/li>\u003cli>\u003cb>Az égre festett csodavilág\u003c/b>\u003cspan>Tóth Ferenc, NÚVU Kft.\u003c/span>\u003cem>49. oldal\u003c/em>\u003c/li>\u003c/ul>\u003cp class=\"note\">A teljes lapszám PDF-ben is letölthető (2,0 MB).\u003c/p>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>A lapszám adatai\u003c/h4>\u003cdl>\u003cdt>Évfolyam\u003c/dt>\u003cdd>XXX. évfolyam\u003c/dd>\u003cdt>Megjelenés\u003c/dt>\u003cdd>2018. november\u003c/dd>\u003cdt>Terjedelem\u003c/dt>\u003cdd>53 oldal\u003c/dd>\u003cdt>ISSN\u003c/dt>\u003cdd>0865-9813\u003c/dd>\u003c/dl>\u003c/div>\u003cdiv class=\"slot\" data-slot=\"lapozo:side2\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm ct cd\">300 × 250\u003cem>Medium rectangle\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm ct cd\">\u003ca class=\"ad pr pr-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pr-radar r-l\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-name\">PályázatRadar Pro\u003c/span>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan class=\"pr-sub\">24 órán belül értesítjük, szakértői összefoglalóval.\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Olvasási tippek\u003c/h4>\u003cul>\u003cli>\u003cspan>← → billentyűkkel lapozhat\u003c/span>\u003c/li>\u003cli>\u003cspan>Kattintson az oldal szélére\u003c/span>\u003c/li>\u003cli>\u003cspan>Mobilon húzza el ujjal\u003c/span>\u003c/li>\u003cli>\u003cspan>Az Oldalak gombbal indexképeket kap\u003c/span>\u003c/li>\u003cli>\u003cspan>A Teljes képernyő a legjobb olvasási élmény\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>További lapszámok\u003c/h4>\u003cp>A magazin 1989 óta jelenik meg. Az archívum digitalizálása folyamatos.\u003c/p>\u003ca class=\"btn ghost\" data-p=\"magazin\">Lapszámarchívum\u003c/a>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>","p:uzleti-partnerinfo":"\u003cdiv class=\"p-hero\">\u003cspan class=\"im\">\u003cimg alt=\"Íróasztal a magazinnal, laptoppal és földgömbbel\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/hero-partnerinfo-1200.webp\"/>\u003c/span>\u003c/div>\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Üzleti partnerinfó\u003c/p>\u003ch1 class=\"p-h1\">Üzleti partnerinfó\u003c/h1>\u003cp class=\"p-desc\">Megjelenési lehetőségek a döntéshozói asztalon és a vállalkozói postaládában.\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">Miért az EUGM?\u003c/p>\u003ch2 class=\"h2\">Egy célzott médium, amely nem a tömeget, hanem a döntéshozót éri el\u003c/h2>\u003cp class=\"intro\">A magazin V.I.P. céges listára, perszonalizált levél kíséretében jut el a kormányzati, minisztériumi és nagyvállalati vezetőkhöz — miközben a digitális kiadás és a portál a teljes KKV-szektor felé nyit.\u003c/p>\u003cdiv class=\"feat f4\">\u003cdiv>\u003ch3>Célzott terjesztés\u003c/h3>\u003cp>Névre szóló, ablakos borítékos kézbesítés a döntéshozói listára.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>37+ év hitelesség\u003c/h3>\u003cp>1989 óta a hazai gazdasági élet folyamatos szereplője.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Kettős csatorna\u003c/h3>\u003cp>Nyomtatott presztízs és mérhető digitális elérés egy csomagban.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Szerkesztett tartalom\u003c/h3>\u003cp>PR-cikk és interjú a magazin szerkesztőségi minőségében.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">Megjelenési formák\u003c/p>\u003ch2 class=\"h2\">Amiből választhat\u003c/h2>\u003cdiv class=\"feat f3\">\u003cdiv>\u003ch3>Hirdetési felület\u003c/h3>\u003cp>Egész, fél és negyed oldalas hirdetési felületek a nyomtatott és a digitális kiadásban, kiemelt borítóoldali pozíciókkal.\u003c/p>\u003cul>\u003cli>B2, B3, B4 borítóoldalak\u003c/li>\u003cli>Belíves egész és fél oldal\u003c/li>\u003cli>Rovathoz kötött elhelyezés\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch3>PR-cikk és interjú\u003c/h3>\u003cp>Szerkesztőségi minőségben készülő vállalatbemutató, vezetői interjú vagy esettanulmány — a magazin hangvételében.\u003c/p>\u003cul>\u003cli>Vezetői interjú (2–4 oldal)\u003c/li>\u003cli>Cégbemutató és esettanulmány\u003c/li>\u003cli>Fotózás és szövegírás igény szerint\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch3>Portál és hírlevél\u003c/h3>\u003cp>Online cikkmegjelenés, banner-pozíciók a portálon, valamint kiemelés az eugmonline hírlevélben.\u003c/p>\u003cul>\u003cli>Portálcikk saját aloldallal\u003c/li>\u003cli>Banner a rovatoldalakon\u003c/li>\u003cli>Hírlevélbeli kiemelés\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"house\">\u003ch4>Online megjelenés a portálon\u003c/h4>\u003cp>A portál saját hirdetési felületei, töréspontonként külön méretben. Ez házi tartalom, nem külső hirdetési hely.\u003c/p>\u003cul>\u003cli>Branding tapéta 1920 × 1080\u003c/li>\u003cli>Rovatfejléc 970 × 250\u003c/li>\u003cli>Oldalsáv 300 × 600\u003c/li>\u003cli>Videó 16:9\u003c/li>\u003cli>Podcast-kártya 300 × 250\u003c/li>\u003cli>Natív cikk\u003c/li>\u003cli>Rovattámogatás\u003c/li>\u003cli>Mobil horgony 320 × 50\u003c/li>\u003c/ul>\u003c/div>\u003cp class=\"note\">A megjelenési megállapodásokat a szerkesztőség minden partnerrel egyedileg köti, a célközönség és a kampány jellege szerint.\u003c/p>\u003c/section>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">Megjelenési formáink\u003c/p>\u003ch2 class=\"h2\">Két csatorna, egy célközönség\u003c/h2>\u003cdiv class=\"feat f2\">\u003cdiv>\u003ch3>Exkluzív nyomtatott magazin\u003c/h3>\u003cp>V.I.P. céges listára, ablakos borítékban, perszonalizált levél kíséretében, térítésmentesen kerül kézbesítésre a döntéshozók részére.\u003c/p>\u003cul>\u003cli>Kormányzati és minisztériumi vezetők\u003c/li>\u003cli>Irányító hatóságok döntéshozói\u003c/li>\u003cli>Nagyvállalati felsővezetők\u003c/li>\u003cli>Kamarai és érdekképviseleti vezetők\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch3>Digitális, lapozható változat\u003c/h3>\u003cp>Szerverre telepített, lapozható e-változat, amelyet perszonalizált e-mailben kapnak meg olvasóink.\u003c/p>\u003cul>\u003cli>Azonnali elérhetőség bárhonnan\u003c/li>\u003cli>Cikkenkénti önálló oldal és kereshetőség\u003c/li>\u003cli>Kiterjesztett elérés a KKV-szektor felé\u003c/li>\u003cli>Mérhető olvasottság és átkattintás\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">Kinek szól\u003c/p>\u003ch2 class=\"h2\">Olvasóink köre\u003c/h2>\u003cdiv class=\"feat f3\">\u003cdiv>\u003ch3>Kormányzat és hatóságok\u003c/h3>\u003cp>Minisztériumi vezetők és az irányító hatóságok döntéshozói.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Nagyvállalati felsővezetők\u003c/h3>\u003cp>Ügyvezetők, beszerzési és stratégiai területek vezetői.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>KKV-k és egyéni vállalkozók\u003c/h3>\u003cp>A digitális kiadás és a hírlevél kiterjesztett elérésén keresztül.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">Egyeztetés\u003c/p>\u003ch2 class=\"h2\">Beszéljük meg, mire van szüksége\u003c/h2>\u003cp class=\"intro\">Írja meg, milyen célközönséget szeretne elérni, és a szerkesztőség személyre szabott javaslatot készít a megjelenésre.\u003c/p>\u003cp class=\"intro\">Telefon: +36 (70) 905 0049\u003cbr/>E-mail: info@magazinpress.hu\u003c/p>\u003ca class=\"btn\" data-p=\"kapcsolat\">Kapcsolatfelvétel →\u003c/a>\u003c/section>","p:kapcsolat":"\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Kapcsolat\u003c/p>\u003ch1 class=\"p-h1\">Kapcsolat\u003c/h1>\u003cp class=\"p-desc\">Írjon nekünk — a szerkesztőség munkanapokon válaszol.\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cp class=\"kick\">Üzenetküldés\u003c/p>\u003ch2 class=\"h2\">Miben segíthetünk?\u003c/h2>\u003cp class=\"intro\">Legyen szó megjelenési ajánlatkérésről, szerkesztőségi témajavaslatról vagy hírlevél-feliratkozásról — töltse ki az űrlapot, és felvesszük Önnel a kapcsolatot.\u003c/p>\u003cdiv class=\"form\">\u003cdiv class=\"row\">\u003clabel>Név *\u003cinput/>\u003c/label>\u003clabel>Cég / szervezet\u003cinput/>\u003c/label>\u003c/div>\u003cdiv class=\"row\">\u003clabel>E-mail cím *\u003cinput type=\"email\"/>\u003c/label>\u003clabel>Telefon\u003cinput/>\u003c/label>\u003c/div>\u003clabel>Megkeresés tárgya\u003cselect>\u003coption>Megjelenés, hirdetés\u003c/option>\u003coption>PR-cikk, interjú javaslata\u003c/option>\u003coption>Szerkesztőségi témajavaslat\u003c/option>\u003coption>Előfizetés, lapszám igénylése\u003c/option>\u003coption>Egyéb\u003c/option>\u003c/select>\u003c/label>\u003clabel>Üzenet *\u003ctextarea>\u003c/textarea>\u003c/label>\u003cdiv class=\"captcha\">CAPTCHA / spamvédelem helye — az éles oldalon aktív\u003c/div>\u003clabel class=\"chk\">\u003cinput type=\"checkbox\"/> Elolvastam és elfogadom az adatkezelési tájékoztatót, és hozzájárulok az adataim kapcsolatfelvétel céljából történő kezeléséhez. *\u003c/label>\u003cdiv>\u003cspan class=\"btn\">Üzenet elküldése\u003c/span>\u003c/div>\u003cp class=\"note\">A *-gal jelölt mezők kitöltése kötelező.\u003c/p>\u003c/div>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>Szerkesztőség\u003c/h4>\u003cdl>\u003cdt>Telefon\u003c/dt>\u003cdd>+36 (70) 905 0049\u003c/dd>\u003cdt>E-mail\u003c/dt>\u003cdd>info@magazinpress.hu\u003c/dd>\u003c/dl>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Kiadó\u003c/h4>\u003cp>Magazin Press\u003cbr/>ISSN 0865-9813 · Alapítva 1989\u003c/p>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>Kövessen minket\u003c/h4>\u003cp>Friss anyagaink a közösségi oldalunkon és a hírlevélben.\u003c/p>\u003ca class=\"btn ghost\" data-p=\"index\">Hírlevél-feliratkozás\u003c/a>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>","p:impresszum":"\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Impresszum\u003c/p>\u003ch1 class=\"p-h1\">Impresszum\u003c/h1>\u003cp class=\"p-desc\">A magazin és a portál kiadói, szerkesztőségi és üzemeltetési adatai.\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"legal\">\u003ch2>A lap adatai\u003c/h2>\u003cul>\u003cli>A lap címe: Új Európai Gazdasági Magazin\u003c/li>\u003cli>Alapítva: 1989 (Új Gazdasági Magazin néven), 2004-től Új Európai Gazdasági Magazin\u003c/li>\u003cli>Évfolyam: XXXVIII. évfolyam\u003c/li>\u003cli>ISSN: 0865-9813\u003c/li>\u003cli>Megjelenés: nyomtatott és lapozható digitális kiadás\u003c/li>\u003c/ul>\u003ch2>Kiadó és szerkesztőség\u003c/h2>\u003cul>\u003cli>Kiadó: Magazin Press\u003c/li>\u003cli>Alapító-főszerkesztő: Óvári László\u003c/li>\u003cli>Telefon: +36 (70) 905 0049\u003c/li>\u003cli>E-mail: info@magazinpress.hu\u003c/li>\u003c/ul>\u003ch2>A weboldal fejlesztése és üzemeltetése\u003c/h2>\u003cul>\u003cli>Fejlesztő: Grafcom Media Kft.\u003c/li>\u003cli>Székhely: 1024 Budapest, Rómer Flóris utca 4.\u003c/li>\u003cli>Képviselő: Magdó Emil\u003c/li>\u003cli>Weboldal: grafcom.hu\u003c/li>\u003c/ul>\u003ch2>Támogatás\u003c/h2>\u003cp>A weboldal a Demján Sándor Program keretében és támogatásával valósult meg, a Neumann János Nonprofit Közhasznú Korlátolt Felelősségű Társaság által kiírt „Minden vállalkozásnak legyen saját honlapja” Program pályázat keretében.\u003c/p>\u003ch2>Nyilvántartási adatok\u003c/h2>\u003cp>A kiadói és szerkesztőségi tevékenységet Óvári László József egyéni vállalkozó végzi. A nyilvántartási adatokat a kiadó adja meg. A kapcsolattartás telefonon és e-mailben történik.\u003c/p>\u003ch2>Tárhelyszolgáltató\u003c/h2>\u003cp>ViaCom Informatikai Kereskedelmi és Szolgáltató Kft. · 2360 Gyál, Deák Ferenc utca 17.\u003c/p>\u003ch2>Szerzői jogok\u003c/h2>\u003cp>A weboldalon megjelenő valamennyi tartalom — szöveg, fotó, grafika, logó és elrendezés — szerzői jogi védelem alatt áll. Felhasználás, másolás, terjesztés vagy átdolgozás kizárólag a kiadó előzetes írásbeli engedélyével lehetséges.\u003c/p>\u003ch2>Felelősség\u003c/h2>\u003cp>A kiadó az információk pontosságáért mindent megtesz, de a felhasználásukból eredő károkért felelősséget nem vállal. A hirdetések és fizetett megjelenések tartalmáért a megrendelő felel. A külső hivatkozások tartalmáért a kiadó nem vállal felelősséget.\u003c/p>\u003ch2>Adatkezelés\u003c/h2>\u003cp>A személyes adatok kezelésének részleteit az \u003ca class=\"more\" data-p=\"adatvedelem\">Adatkezelési tájékoztató\u003c/a> tartalmazza.\u003c/p>\u003c/div>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>Gyors adatok\u003c/h4>\u003cdl>\u003cdt>ISSN\u003c/dt>\u003cdd>0865-9813\u003c/dd>\u003cdt>Alapítva\u003c/dt>\u003cdd>1989\u003c/dd>\u003cdt>Évfolyam\u003c/dt>\u003cdd>XXXVIII. évfolyam\u003c/dd>\u003c/dl>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Elérhetőség\u003c/h4>\u003cul>\u003cli>\u003cspan>+36 (70) 905 0049\u003c/span>\u003c/li>\u003cli>\u003cspan>info@magazinpress.hu\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>Megjelenési lehetőségek\u003c/h4>\u003cp>Hirdetés, PR-cikk, interjú a magazinban és a portálon.\u003c/p>\u003ca class=\"btn ghost\" data-p=\"uzleti-partnerinfo\">Üzleti partnerinfó\u003c/a>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>","p:adatvedelem":"\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Adatkezelési tájékoztató\u003c/p>\u003ch1 class=\"p-h1\">Adatkezelési tájékoztató\u003c/h1>\u003cp class=\"p-desc\">Hatályos: 2026. … · A GDPR és az Infotv. rendelkezései szerint\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv class=\"legal\">\u003cp class=\"draft\">Kitöltendő mezők — a csillaggal jelölt adatokat a szerkesztőségnek kell véglegesítenie az élesítés előtt\u003c/p>\u003ch2>1. A tájékoztató célja\u003c/h2>\u003cp>Az Óvári László József e.v. (a továbbiakban: Adatkezelő) kötelezettséget vállal arra, hogy a tevékenységével kapcsolatos minden adatkezelés megfelel a hatályos nemzeti jogszabályokban, valamint az Európai Unió jogi aktusaiban meghatározott elvárásoknak.\u003c/p>\u003ch2>2. Az adatkezelő adatai\u003c/h2>\u003cul>\u003cli>\u003cb>Név:\u003c/b> Óvári László József e.v.\u003c/li>\u003cli>\u003cb>Székhely:\u003c/b> a szerkesztőség pontosítja\u003c/li>\u003cli>\u003cb>Telefonszám:\u003c/b> +36 (70) 905 0049\u003c/li>\u003cli>\u003cb>E-mail:\u003c/b> info@magazinpress.hu\u003c/li>\u003c/ul>\u003ch2>3. A kezelt személyes adatok köre\u003c/h2>\u003cp>\u003cb>Kapcsolatfelvételi űrlap:\u003c/b> név, e-mail-cím, cég vagy szervezet neve (nem kötelező), telefonszám (nem kötelező), az üzenet szövege.\u003c/p>\u003cp>\u003cb>Hírlevél:\u003c/b> név és e-mail-cím.\u003c/p>\u003cp>\u003cb>Technikai adatok:\u003c/b> a látogató böngészőjére, IP-címére és a meglátogatott oldalakra vonatkozó adatok.\u003c/p>\u003ch2>4. Sütik (cookie-k)\u003c/h2>\u003cp>\u003cb>Szükséges sütik:\u003c/b> a munkamenet végével automatikusan törlődnek.\u003c/p>\u003cp>\u003cb>Analitika:\u003c/b> Google Analytics és Google Tag Manager.\u003c/p>\u003cp>\u003cb>Közösségi média:\u003c/b> Facebook Pixel.\u003c/p>\u003ch2>5. Adattovábbítás, adatfeldolgozás\u003c/h2>\u003cp>Az Adatkezelő a következő adatfeldolgozókat veszi igénybe: ViaCom Informatikai Kereskedelmi és Szolgáltató Kft. (tárhely), Google Ireland Limited, Meta Platforms Ireland Limited, a hírlevélküldő rendszer szolgáltatója, valamint a Grafcom Media Kft. (fejlesztés és üzemeltetés).\u003c/p>\u003ch2>6. Az adatkezelés célja, módja és jogalapja\u003c/h2>\u003cp>Az adatkezelések az érintett önkéntes hozzájárulásán, illetve törvényi felhatalmazáson alapulnak.\u003c/p>\u003ch2>7. Az érintett jogai és jogérvényesítési lehetőségei\u003c/h2>\u003cul>\u003cli>\u003cb>Tájékoztatáshoz való jog:\u003c/b> az Adatkezelő legfeljebb egy hónapon belül válaszol.\u003c/li>\u003cli>\u003cb>Helyesbítéshez való jog:\u003c/b> a pontatlan vagy hiányos adatok módosíthatók.\u003c/li>\u003cli>\u003cb>Törléshez való jog:\u003c/b> az Adatkezelő indokolatlan késedelem nélkül törli az adatokat.\u003c/li>\u003cli>\u003cb>Az adatkezelés korlátozásához való jog\u003c/b>\u003c/li>\u003cli>\u003cb>Adathordozhatósághoz való jog:\u003c/b> az adatok tagolt, széles körben használt, géppel olvasható formátumban kérhetők.\u003c/li>\u003cli>\u003cb>Tiltakozáshoz való jog\u003c/b>\u003c/li>\u003cli>\u003cb>A hozzájárulás visszavonásának joga\u003c/b>\u003c/li>\u003c/ul>\u003ch2>8. Jogorvoslati lehetőségek\u003c/h2>\u003cp>Az érintett bírósághoz fordulhat, vagy panaszt tehet a Nemzeti Adatvédelmi és Információszabadság Hatóságnál (NAIH).\u003c/p>\u003cul>\u003cli>Cím: 1055 Budapest, Falk Miksa utca 9–11.\u003c/li>\u003cli>Telefon: +36 (1) 391-1400\u003c/li>\u003cli>E-mail: ugyfelszolgalat@naih.hu\u003c/li>\u003c/ul>\u003ch2>9. Egyéb rendelkezések\u003c/h2>\u003cp>Az Adatkezelő gondoskodik az adatok biztonságáról: SSL-tanúsítvánnyal, tűzfallal, végpontvédelemmel és webalkalmazás-tűzfallal.\u003c/p>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>Tartalomjegyzék\u003c/h4>\u003cul>\u003cli>\u003cspan>1. A tájékoztató célja\u003c/span>\u003c/li>\u003cli>\u003cspan>2. Az adatkezelő adatai\u003c/span>\u003c/li>\u003cli>\u003cspan>3. A kezelt személyes adatok köre\u003c/span>\u003c/li>\u003cli>\u003cspan>4. Sütik (cookie-k)\u003c/span>\u003c/li>\u003cli>\u003cspan>5. Adattovábbítás, adatfeldolgozás\u003c/span>\u003c/li>\u003cli>\u003cspan>6. Az adatkezelés célja, módja és jogalapja\u003c/span>\u003c/li>\u003cli>\u003cspan>7. Az érintett jogai és jogérvényesítési lehetőségei\u003c/span>\u003c/li>\u003cli>\u003cspan>8. Jogorvoslati lehetőségek\u003c/span>\u003c/li>\u003cli>\u003cspan>9. Egyéb rendelkezések\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>Kérdése van?\u003c/h4>\u003cp>Adatkezeléssel kapcsolatos kérdéseit az alábbi címre várjuk.\u003c/p>\u003cp>info@magazinpress.hu\u003c/p>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>","ftr":"\u003cdiv class=\"dsp\">\u003cspan>A weboldal a Demján Sándor Program keretében és támogatásával valósult meg.\u003c/span>\u003cspan class=\"im contain\">\u003cimg alt=\"Demján Sándor Program logó\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/dsp-logo-feher.png\"/>\u003c/span>\u003cspan class=\"im contain\">\u003cimg alt=\"Neumann János Nonprofit Közhasznú Kft. logó\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/neum-logo-feher.png\"/>\u003c/span>\u003c/div>\u003cfooter class=\"s-ft\">\u003cdiv class=\"ft-grid\">\u003cdiv>\u003cspan class=\"im contain\">\u003cimg alt=\"Új Európai Gazdasági Magazin logó\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/eugm-logo-light.png\"/>\u003c/span>\u003cp>Alapítva 1989-ben. A hazai gazdasági élet meghatározó véleményformálója, amely kommunikációs hidat épít a mikro-, kis- és középvállalkozások, a nagyvállalatok és a gazdaságot irányító döntéshozók között.\u003c/p>\u003cdiv class=\"soc\">\u003cspan>f\u003c/span>\u003cspan>in\u003c/span>\u003cspan>@\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003ch5>Rovatok\u003c/h5>\u003cul>\u003cli>\u003ca data-p=\"gazdasag\">Gazdaság\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"europai-unio\">Európai Unió\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"vallalkozoihid\">Vállalkozóihíd\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"digitalis-lendulet\">Digitális lendület\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"gm-elet\">GmÉlet\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"hirek\">Hírek\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch5>A magazinról\u003c/h5>\u003cul>\u003cli>\u003ca data-p=\"magazin-story\">EUGM Story\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"magazin\">Lapszámarchívum\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"uzleti-partnerinfo\">Üzleti partnerinfó\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"impresszum\">Impresszum\u003c/a>\u003c/li>\u003cli>\u003ca data-p=\"adatvedelem\">Adatkezelési tájékoztató\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch5>Kapcsolat\u003c/h5>\u003cul>\u003cli>Telefon: +36 (70) 905 0049\u003c/li>\u003cli>E-mail: info@magazinpress.hu\u003c/li>\u003cli>\u003cb>Kiadó\u003c/b>\u003c/li>\u003cli>Magazin Press\u003c/li>\u003cli>ISSN 0865-9813\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"ft-bot\">\u003cspan>© 2026 Új Európai Gazdasági Magazin. Minden jog fenntartva.\u003c/span>\u003cnav>\u003ca data-p=\"adatvedelem\">Adatvédelem\u003c/a>\u003ca data-p=\"impresszum\">Impresszum\u003c/a>\u003ca data-p=\"kapcsolat\">Kapcsolat\u003c/a>\u003c/nav>\u003c/div>\u003c/footer>"}}</script>

    if (!data || !data.regions || !Array.isArray(data.pages) || !data.pages.length) { toast('Ebben a fájlban nem találtam szerkesztett oldaltartalmat. Az oldalszerkesztőből mentett HTML-fájlt válassza.', null, 8000); return; }
    if (S.editing) stopEditing(true);
    transact('Tartalom betöltése fájlból', () => {
      applyPages(data.pages);
      regionIds().forEach(rid => { const el = regionEl(rid); if (el) { el.innerHTML = data.regions[rid] != null ? data.regions[rid] : (ORIG.regions[rid] || ''); initInteractive(el); } });
    });
    S.sel = null;
    show(pageById(UI.page) ? UI.page : S.pages[0].id, { keepScroll: true });
    toast(`Betöltöttük a(z) ${f.name} tartalmát. ${STANDALONE ? 'A megtartáshoz mentse fájlba.' : 'A megtartáshoz mentse el.'}`, { label: 'Visszavonás', fn: undo }, 9000);
  };
  rd.readAsText(f);
});
$('#keys').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('[data-close]')) $('#keys').hidden = true; });

/* ------------------------------------------------------------ billentyűk */
D.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key;
  if (!$('#keys').hidden && k === 'Escape') { $('#keys').hidden = true; return; }
  if (mod && (k === 's' || k === 'S')) { e.preventDefault(); save(); return; }
  if (mod && (k === 'p' || k === 'P')) { e.preventDefault(); setMode(UI.mode === 'edit' ? 'view' : 'edit'); return; }
  if (S.drag && k === 'Escape') { endDrag(); return; }
  if (S.pan && k === 'Escape') { setPan(false); return; }
  const t = e.target;
  const inField = t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]');
  if (inField || UI.mode !== 'edit') return;
  if (mod && !e.shiftKey && (k === 'z' || k === 'Z')) { e.preventDefault(); undo(); return; }
  if (mod && ((e.shiftKey && (k === 'z' || k === 'Z')) || k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (!S.sel) return;
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); delSel(); }
  else if (mod && (k === 'd' || k === 'D')) { e.preventDefault(); dupSel(); }
  else if (e.altKey && k === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  else if (e.altKey && k === 'ArrowDown') { e.preventDefault(); moveSel(1); }
  else if (k === 'Escape') { select(null); }
  else if (k === 'Enter' && !(t && t.closest && t.closest('button,a,summary'))) { const tt = editTarget(S.sel); if (tt) { e.preventDefault(); startEditing(tt); } else if (slotOf(S.sel) && (S.sel.matches(ATOMIC) || S.sel.matches('.s-slot'))) { e.preventDefault(); focusAdFields(); } }
});

/* ------------------------------------------------------------ indítás */
app.classList.add('is-loading');
$('#t-dims').checked = UI.dims; device.classList.toggle('dims', UI.dims);
$('#t-brand').checked = UI.brand; device.classList.toggle('no-brand', !UI.brand);
$('#panel').classList.toggle('min', !!UI.min);
setMode(UI.mode === 'view' ? 'view' : 'edit');
renderLib();
setTab(['lib', 'nav', 'set'].includes(UI.tab) ? UI.tab : 'lib');
updateSaveUI(); updateHistBtns();
if (!STANDALONE) dlP.then(d => { const b = $('#m-dl'); b.disabled = !d; if (!d) b.title = 'Ebben a nézetben nem érhető el'; });
if ('ResizeObserver' in window) {
  const ro = new ResizeObserver(() => layout()); ro.observe(stage);
  const ro2 = new ResizeObserver(() => { liveAll(); rafOverlay(); }); ro2.observe(site);
}
window.addEventListener('resize', layout);
if (D.fonts && D.fonts.ready) D.fonts.ready.then(() => { layout(); });
layout();

loadData().then(data => {
  loadInto(data);
  const start = (location.hash || '').slice(1);
  UI.page = pageById(start) ? start : (pageById(UI.page) ? UI.page : 'index');
  show(UI.page, { keepScroll: false });
  app.classList.remove('is-loading');
  checkDraft();
  updateSaveUI(); updateHistBtns();
  if (UI.tab === 'nav') renderNav();
  if (UI.tab === 'set') renderSettings();
  layout();
});
})();
