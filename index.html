 év fix kamattal\u003c/span>\u003cb>38 000 000 Ft\u003c/b>\u003cspan class=\"pb-track\">\u003c/span>\u003cspan>Havi törlesztő (példa)\u003c/span>\u003cb class=\"big\">572 400 Ft\u003c/b>\u003c/span>\u003cspan class=\"pb-legal\">A hirdetés tájékoztató jellegű, nem minősül ajánlattételnek.\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">Vezércikk\u003c/p>\u003cdiv class=\"lead-art\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Digitális jelenlét és üzleti eredmény\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-1200.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"kick\">Gazdaság · Interjú\u003c/p>\u003ch2 data-p=\"cikk\">Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\u003c/h2>\u003cp>A hazai KKV-k 72 százalékának van honlapja, az „értékesítés és marketing” mutatójuk mégis 14 pont a százfokú skálán. Óvári László alapító-főszerkesztő Magdó Emillel, a Grafcom Media ügyvezetőjével beszélgetett arról, mi a különbség a digitális eszközök megléte és a valódi piaci jelenlét között.\u003c/p>\u003ca class=\"more\" data-p=\"cikk\">Tovább a cikkre\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"tiles\">\u003ca class=\"tile\" data-p=\"magazin-story\">\u003cb>Magazin story\u003c/b>\u003cspan>Honnan jött a lap, és mit vállal ma. A rendszerváltástól az uniós fókuszig.\u003c/span>\u003c/a>\u003ca class=\"tile\" data-p=\"gazdasag\">\u003cb>Gazdaság\u003c/b>\u003cspan>Hazai és uniós gazdasági folyamatok a kis- és középvállalkozások szemszögéből.\u003c/span>\u003c/a>\u003ca class=\"tile\" data-p=\"europai-unio\">\u003cb>Európai Unió\u003c/b>\u003cspan>Fejlesztési források, szabályozás és uniós intézmények — magyar nyelven.\u003c/span>\u003c/a>\u003ca class=\"tile\" data-p=\"vallalkozoihid\">\u003cb>Vállalkozóihíd\u003c/b>\u003cspan>A lap kiemelt projektje: közös platform vállalkozóknak, nagyvállalatoknak, döntéshozóknak.\u003c/span>\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">A portálról\u003c/p>\u003ch2 class=\"h2\">Friss anyagaink\u003c/h2>\u003cp class=\"intro\">A portál most indul: az alábbi írások nyitják a sort. A rovatok folyamatosan bővülnek.\u003c/p>\u003cdiv class=\"cards c3\">\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-800.webp\"/>\u003cspan class=\"topic\">Vállalkozásfejlesztés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003c/p>\u003ch3 data-p=\"cikk\">Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\u003c/h3>\u003cp class=\"lead\">Van honlap, közösségi média és egyre több digitális eszköz. A magyar kis- és középvállalkozások egyik következő nagy feladata mégis az lehet, hogy a digitális jelenlétből valódi piaci jelenlétet építsenek.\u003c/p>\u003cp class=\"by\">Óvári László interjúja Magdó Emillel\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/promise-group-800.webp\"/>\u003cspan class=\"topic\">Vállalkozásfejlesztés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003c/p>\u003ch3 data-p=\"cikk\">Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\u003c/h3>\u003cp class=\"lead\">A vállalatok ma már nem csupán licenceket keresnek, hanem olyan technológiai partnereket, amelyek a felhőszolgáltatásoktól az AI-megoldásokon át a kiberbiztonságig képesek támogatni digitális fejlődésüket.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Európa-élményközpont Budapest szívében\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/europa-elmenykozpont-800.webp\"/>\u003cspan class=\"topic\">Uniós intézmények\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Európai Unió\u003c/p>\u003ch3 data-p=\"cikk\">Európa-élményközpont Budapest szívében\u003c/h3>\u003cp class=\"lead\">Kétezer négyzetméteres multimédiás tér, 360 fokos mozi és szerepjáték arról, milyen európai parlamenti képviselőnek lenni.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003c/div>\u003cp style=\"margin:22px 0 30px\">\u003ca class=\"more\" data-p=\"hirek\">Friss a portálon →\u003c/a>\u003c/p>\u003cdiv class=\"slot-fl\" data-slot=\"index:native\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"live-w\" data-h=\"row\">–\u003c/span>\u003c/span>\u003c/div>\u003ca class=\"ad natw nat-row\">\u003cspan class=\"ph\">\u003csvg preserveAspectRatio=\"xMidYMid slice\" viewBox=\"0 0 320 180\">\u003crect fill=\"#ffc862\" height=\"180\" width=\"320\">\u003c/rect>\u003crect fill=\"#e9ad4f\" height=\"62\" width=\"320\" y=\"118\">\u003c/rect>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" r=\"26\">\u003c/circle>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" fill-opacity=\".3\" r=\"38\">\u003c/circle>\u003cpolygon fill=\"#26435e\" points=\"40,172 110,112 290,112 250,172\">\u003c/polygon>\u003cg fill=\"none\" stroke=\"#8fb3d6\" stroke-width=\"1.3\">\u003cpath d=\"M86.7 132H276.7M63.3 152H263.3M82 172L146 112M124 172L182 112M166 172L218 112M208 172L254 112\">\u003c/path>\u003c/g>\u003c/svg>\u003c/span>\u003cspan class=\"nat-in\">\u003cspan class=\"nat-chip\">Szponzorált tartalom\u003c/span>\u003cb class=\"nat-t\">Harmadával kisebb energiaszámla: így számolt egy kecskeméti pékség\u003c/b>\u003cspan class=\"nat-l\">Tetőre szerelt napelem, okos mérés és egy tizenkét éves konstrukció. A tulajdonos elmondja, mikor térült meg a beruházás.\u003c/span>\u003cspan class=\"nat-by\">Partnerünk: Napfény Energia Zrt.\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003c/section>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv class=\"prose\">\u003cp class=\"kick\">Fókusz\u003c/p>\u003ch2>Építjük a magyarországi vállalkozói világ közösségét\u003c/h2>\u003cp>A XXXVIII. évfolyamában megjelenő Új Európai Gazdasági Magazin szerkesztőgárdája elkötelezett híve a gazdaság szereplői közötti üzleti bizalom építésének és fejlesztésének. Stratégiai célunk segíteni az objektív és egészséges információk áramlását.\u003c/p>\u003cp class=\"q\">Bizalom hiányában a gazdaság sem működik — bizalom nélkül nem létezik üzleti siker.\u003c/p>\u003cp>Elkötelezettségünkből adódóan egyfajta kommunikációs hidat építünk a mikro-, kis- és középvállalkozások, valamint a nagyvállalatok és a gazdaságot irányító döntéshozók között. Kiemelten tekintünk az egyéni vállalkozók szegmensére is.\u003c/p>\u003cp>Tartalmi stratégiánkban meghatározó szerepet szánunk az uniós vetületet érintő információknak, beleértve a fejlesztési támogatások lehetőségeinek megismertetését is. Meggyőződésünk, hogy a hazai vállalkozásoknak nem több információra van szükségük, hanem \u003cb>érthető, magyar nyelvű és időben érkező\u003c/b> információra arról, ami Európában a saját piacukat érinti.\u003c/p>\u003cp>Elkötelezett kommunikációs partnerei vagyunk a vállalkozások digitális szemléletváltásának folyamataiban. Stratégiai célunk bemutatni a sikeres és innovatív vállalkozásokat, akik etalonként szolgálva bátorító támogatást adhatnak mások számára a munkájuk során felmerülő nehézségek és kihívások leküzdéséhez.\u003c/p>\u003cdiv class=\"focus-quote\">\u003cspan class=\"im\">\u003cimg alt=\"Óvári László\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/ovari-laszlo-avatar-220.webp\"/>\u003c/span>\u003cdiv>\u003cp>„Kiemelt figyelmet fordítunk a vállalkozások pozitív ass=\"pod-time\">0:00 / 0:30\u003c/span>\u003cspan class=\"pod-sp\">Támogató\u003cb>Kvadráns Könyvvizsgáló\u003c/b>\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">Vállalkozóihíd\u003c/p>\u003ch2 class=\"h2\">Három irányban kötünk össze\u003c/h2>\u003cdiv class=\"prose\">\u003cp>A magyar gazdaság szereplői között ma nem az információ mennyisége a szűk keresztmetszet, hanem az, hogy a fontos információ eljut-e ahhoz, akinek szüksége van rá — időben és érthető nyelven.\u003c/p>\u003cp>Az Európai Unió és a hazai vállalkozások, a nagyvállalatok és a KKV-k, valamint maguk a vállalkozók között építünk átjárót. Hogy ez a gyakorlatban mit jelent, azt a Vállalkozóihíd oldalán fejtjük ki.\u003c/p>\u003c/div>\u003ca class=\"btn\" data-p=\"vallalkozoihid\">Mi a Vállalkozóihíd?\u003c/a>\u003c/section>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">Beharangozó\u003c/p>\u003ch2 class=\"h2\">Ami hamarosan következik\u003c/h2>\u003cp class=\"intro\">Megjelenés előtti információk: konferenciák, pályázati határidők és készülő lapszámaink. Ha olyan eseményről tud, amely a vállalkozói kört érinti, \u003ca class=\"more\" data-p=\"kapcsolat\">írja meg a szerkesztőségnek\u003c/a>.\u003c/p>\u003cdiv class=\"cols3\">\u003cdiv class=\"ev\">\u003cp class=\"k\">—Dátum\u003c/p>\u003ch3>Esemény vagy konferencia címe\u003c/h3>\u003cp>Rövid, két mondatos leírás arról, kinek szól az esemény, és miért érdemes odafigyelni rá.\u003c/p>\u003cp class=\"m\">Helyszín · szervező\u003c/p>\u003c/div>\u003cdiv class=\"ev\">\u003cp class=\"k\">—Határidő\u003c/p>\u003ch3>Pályázati kiírás beadási határideje\u003c/h3>\u003cp>Melyik kiírás, kinek szól, és mikor jár le. A részletes ismertető az Európai Unió rovatban jelenik meg.\u003c/p>\u003cp class=\"m\">Uniós vagy hazai forrás\u003c/p>\u003c/div>\u003cdiv class=\"ev\">\u003cp class=\"k\">—Lapszám\u003c/p>\u003ch3>Készülő lapszámunk fő témája\u003c/h3>\u003cp>Mivel foglalkozik a következő szám, és mikorra várható a megjelenése.\u003c/p>\u003cp class=\"m\">Új Európai Gazdasági Magazin\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"note\">A beharangozó tételeit a szerkesztőség tölti fel — a fenti három a megjelenés formáját mutatja.\u003c/p>\u003c/section>\u003cdiv class=\"s-slot wrap\">\u003cdiv class=\"slot\" data-slot=\"index:mid\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">300 × 250\u003cem>Medium rectangle\u003c/em>\u003c/span>\u003cspan class=\"ct\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003cspan class=\"cd\">970 × 90\u003cem>Super leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad pr pr-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pr-radar r-l\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-name\">PályázatRadar Pro\u003c/span>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan class=\"pr-sub\">24 órán belül értesítjük, szakértői összefoglalóval.\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct\">\u003ca class=\"ad pr pr-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"pr-radar r-s\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-txt\">\u003csmall>PályázatRadar Pro\u003c/small>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan>24 órán belül értesítjük, szakértői összefoglalóval.\u003c/span>\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"cd\">\u003ca class=\"ad pr pr-lb\" style=\"width:970px;height:90px\">\u003cspan class=\"pr-radar r-s\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-txt\">\u003csmall>PályázatRadar Pro\u003c/small>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003csp iv>\u003c/div>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">A rovatról\u003c/p>\u003ch2 class=\"h2\">Gazdaság\u003c/h2>\u003cp class=\"intro\">Ami az európai és a hazai gazdaságban történik, és ami ebből egy magyar vállalkozás mindennapjait valóban befolyásolja — gazdaságpolitikai programok, adózás és finanszírozás, beszállítói lehetőségek, munkaerő és külpiaci nyitás.\u003c/p>\u003cdiv class=\"feat f3\">\u003cdiv>\u003ch3>Uniós és hazai fejlesztési források\u003c/h3>\u003cp>Pályázati kiírások, támogatási konstrukciók és finanszírozási lehetőségek — nem jogszabályi nyelven, hanem úgy, ahogy egy vállalkozó dönteni tud belőle.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Digitális szemléletváltás\u003c/h3>\u003cp>Mit jelent a gyakorlatban a digitalizáció egy tíz- vagy ötvenfős cégnél: mibe kerül, mit hoz, és hol szoktak elakadni.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Iparági folyamatok, beszállítói lehetőségek\u003c/h3>\u003cp>Nagyberuházások, ellátási láncok és az a kérdés, hogyan tud egy hazai KKV bekapcsolódni.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"s-slot wrap\">\u003cdiv class=\"slot\" data-slot=\"gazdasag:top\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">320 × 100\u003cem>Nagy mobil banner\u003c/em>\u003c/span>\u003cspan class=\"ct\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003cspan class=\"cd\">970 × 250\u003cem>Billboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad pr pr-mb\" style=\"width:320px;height:100px\">\u003cspan class=\"pr-radar r-s\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-txt\">\u003csmall>PályázatRadar Pro\u003c/small>\u003cb>Új uniós kiírás az Ön ágazatában?\u003c/b>\u003cspan class=\"pr-go\">14 napig ingyen\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct\">\u003ca class=\"ad pr pr-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"pr-radar r-s\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-txt\">\u003csmall>PályázatRadar Pro\u003c/small>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan>24 órán belül értesítjük, szakértői összefoglalóval.\u003c/span>\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"cd\">\u003ca class=\"ad pr pr-bb\" style=\"width:970px;height:250px\">\u003cspan class=\"pr-radar r-l\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-name\">PályázatRadar Pro\u003c/span>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan class=\"pr-sub\">24 órán belül értesítjük, szakértői összefoglalóval és határidő-naptárral.\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cp class=\"kick\">Olvasnivaló\u003c/p>\u003ch2 class=\"h2\">A rovat cikkei\u003c/h2>\u003cp class=\"intro\">A portál indulásához 3 anyag készült el ebben a rovatban. A rovat folyamatosan bővül.\u003c/p>\u003cdiv class=\"cards\">\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-800.webp\"/>\u003cspan class=\"topic\">Vállalkozásfejlesztés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003c/p>\u003ch3 data-p=\"cikk\">Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\u003c/h3>\u003cp class=\"lead\">Van honlap, közösségi média és egyre több digitális eszköz. A magyar kis- és középvállalkozások egyik következő nagy feladata mégis az lehet, hogy a digitális jelenlétből valódi piaci jelenlétet építsenek.\u003c/p>\u003cp class=\"by\">Óvári László interjúja Magdó Emillel\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/promise-group-800.webp\"/>\u003cspan class=\"topic\">Vállalkozásfejlesztés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003c/p>\u003ch3 data-p=\"cikk\">Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\u003c/h3>\u003cp class=\"lead\">A vállalatok ma már nem csupán licenceket keresnek, hanem olyan technológiai partnereket, amelyek a felhőszolgáltatásoktól az AI-megoldásokon át a kiberbiztonságig képesek támogatni digitális fejlődésüket.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003cdiv class=\"slot-fl\" data-slot=\"gazdasag:native\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"live-w\" data-h=\"card\">–\u003c/span>\u003c/span>\u003c/div>\u003ca class=\"ad card card-nat\">\u003cspan class=\"ph\">\u003csvg preserveAspectRatio=\"xMidYMid slice\" viewBox=\"0 0 320 180\">\u003crect fill=\"#ffc862\" height=\"180\" width=\"320\">\u003c/rect>\u003crect fill=\"#e9ad4f\" height=\"62\" width=\"320\" y=\"118\">\u003c/rect>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" r=\"26\">\u003c/circle>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" fill-opacity=\".3\" r=\"38\">\u003c/circle>\u003cpolygon fill=\"#26435e\" points=\"40,172 110,112 290,112 250,172\">\u003c/polygon>\u003cg fill=\"none\" stroke=\"#8fb3d6\" stroke-width=\"1.3\">\u003cpath d=\"M86.7 132H276.7M63.3 152H263.3M82 172L146 112M124 172L182 112M166 172L218 112M208 172L254 112\">\u003c/path>\u003c/g>\u003c/svg>\u003c/span>\u003cspan class=\"nat-in\">\u003cspan class=\"nat-chip\">Szponzorált tartalom\u003c/span>\u003cb class=\"nat-t\">Harmadával kisebb energiaszámla: így számolt egy kecskeméti pékség\u003c/b>\u003cspan class=\"nat-l\">Tetőre szerelt napelem, okos mérés és egy tizenkét éves konstrukció. A tulajdonos elmondja, mikor térült meg a beruházás.\u003c/span>\u003cspan class=\"nat-by\">Partnerünk: Napfény Energia Zrt.\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-800.webp\"/>\u003cspan class=\"topic\">Munkaerő és képzés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003cspan class=\"flag\">Ami igaz, az igaz\u003c/span>\u003c/p>\u003ch3 data-p=\"cikk\">Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\u003c/h3>\u003cp class=\"lead\">A norvég döntés valódi. Az viszont, ami belőle a magyar vállalkozóhoz megérkezik — „az MI káros, várjunk vele” —, már nem az, amit a norvég kormány mondott. Megnéztük, mi a hír, mi van mögötte, és mit érdemes kezdeni vele egy ötfős cégben.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>Témák a rovaton belül\u003c/h4>\u003cul>\u003cli>\u003cspan>Kormányzati és gazdaságpolitikai programok\u003c/span>\u003cspan class=\"soon\">készül\u003c/span>\u003c/li>\u003cli>\u003cspan>Vállalkozásfejlesztés\u003c/span>\u003cspan class=\"cnt\">2\u003c/span>\u003c/li>\u003cli>\u003cspan>Adózás\u003c/span>\u003cspan class=\"soon\">készül\u003c/span>\u003c/li>\u003cli>\u003cspan>Finanszírozás\u003c/span>\u003cspan class=\"soon\">készül\u003c/span>\u003c/li>\u003cli>\u003cspan>Ipar és beszállítói lánc\u003c/span>\u003cspan class=\"soon\">készül\u003c/span>\u003c/li>\u003cli>\u003cspan>Munkaerő és képzés\u003c/span>\u003cspan class=\"cnt\">1\u003c/span>\u003c/li>\u003cli>\u003cspan>Külgazdaság és export\u003c/span>\u003cspan class=\"soon\">készül\u003c/span>\u003c/li>\u003c a\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>","p:vallalkozoihid":"\u003cdiv class=\"p-hero\">\u003cspan class=\"im\">\u003cimg alt=\"A Széchenyi lánchíd naplementében\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/hero-vallalkozoihid-1200.webp\"/>\u003c/span>\u003c/div>\u003cheader class=\"p-head wrap with-logo\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Vállalkozóihíd\u003c/p>\u003ch1 class=\"p-h1\">Vállalkozóihíd\u003c/h1>\u003cp class=\"p-desc\">Kommunikációs híd a magyar KKV-k, a nagyvállalatok és a gazdaságot irányító döntéshozók között — és a vállalkozók között egymással.\u003c/p>\u003c/div>\u003cspan class=\"im contain\">\u003cimg alt=\"Vállalkozói Híd Projekt embléma\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/vhp-logo-560.png\"/>\u003c/span>\u003c/header>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">A fogalom eredete\u003c/p>\u003cfigure class=\"quote-big\">\u003cp>„Az Új Európai Gazdasági Magazin szerkesztőgárdájának kezdeményezésére kialakulóban van egyfajta vállalkozóihíd…”\u003c/p>\u003csmall>Óvári László, alapító-főszerkesztő\u003c/small>\u003c/figure>\u003c/section>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">A híd három iránya\u003c/p>\u003ch2 class=\"h2\">Kiket kötünk össze, és miben\u003c/h2>\u003cp class=\"intro\">A magyar gazdaság szereplői között ma nem az információ mennyisége a szűk keresztmetszet, hanem az, hogy a fontos információ eljut-e ahhoz, akinek szüksége van rá — időben és érthető nyelven.\u003c/p>\u003cdiv class=\"feat f3\">\u003cdiv>\u003cp class=\"k\">Európa → Magyarország\u003c/p>\u003ch3>Uniós források és szakpolitika, magyarul\u003c/h3>\u003cp>Fejlesztési támogatások, pályázati kiírások, jogszabályi változások és piaci feltételek — lefordítva arra a nyelvre, amelyen egy vállalkozó dönteni tud.\u003c/p>\u003ca class=\"more\" data-p=\"europai-unio\">Európai Unió rovat →\u003c/a>\u003c/div>\u003cdiv>\u003cp class=\"k\">Nagyvállalat ↔ KKV\u003c/p>\u003ch3>Út a döntéshozói asztalig\u003c/h3>\u003cp>A nyomtatott lapszám névre szólóan jut el a kormányzati, minisztériumi és nagyvállalati vezetőkhöz.\u003c/p>\u003ca class=\"more\" data-p=\"uzleti-partnerinfo\">Megjelenési lehetőségek →\u003c/a>\u003c/div>\u003cdiv>\u003cp class=\"k\">KKV ↔ KKV\u003c/p>\u003ch3>A vállalkozói közösség egymás között\u003c/h3>\u003cp>Bemutatjuk a sikeres és innovatív vállalkozásokat, akik etalonként szolgálva bátorítást adhatnak másoknak.\u003c/p>\u003ca class=\"more\" data-p=\"vallalkozoihid\">Vállalkozóihíd rovat →\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"s-slot wrap\">\u003cdiv class=\"slot\" data-slot=\"vallalkozoihid:mid\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">300 × 250\u003cem>Medium rectangle\u003c/em>\u003c/span>\u003cspan class=\"ct\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003cspan class=\"cd\">970 × 90\u003cem>Super leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad pb pb-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pb-arcs\">\u003c/span>\u003cspan class=\"pb-logo\">\u003csvg viewBox=\"0 0 24 24\">\u003crect fill=\"#d4f36a\" height=\"24\" rx=\"6\" width=\"24\">\u003c/rect>\u003cpath d=\"M4 15c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003cpath d=\"M4 10c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" opacity=\".5\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003c/svg>Pannonhitel\u003c/span>\u003cb class=\"pb-h\">Fix kamat.\u003cbr/>A futamidő végéig.\u003c/b>\u003cspan class=\"pb-sub\">KKV Beruházási Hitel\u003cbr/>5–150 millió forintig\u003c/span>\u003cspan class=\"pb-cta\">Kiszámolom\u003c/span>\u003cspan class=\"pb-legal\">Tájékoztató jellegű, nem minősül ajánlattétel class=\"ad fo fo-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · AI, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"cd\">\u003ca class=\"ad fo fo-lb\" style=\"width:970px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · mesterséges intelligencia, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-note\">Kedvezményes jegyek\u003cbr/>október 15-ig\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>","p:digitalis-lendulet":"\u003cdiv class=\"p-hero\">\u003cspan class=\"im\">\u003cimg alt=\"Processzor és adatvizualizáció a budapesti látkép előtt\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-1200.webp\"/>\u003c/span>\u003c/div>\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Digitális lendület\u003c/p>\u003ch1 class=\"p-h1\">Digitális lendület\u003c/h1>\u003cp class=\"p-desc\">A magazin programja a vállalkozások digitális szemléletváltásáért — egy helyen mindaz, amit a témában írunk.\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"s-slot wrap plain\">\u003cdiv class=\"slot-fl\" data-slot=\"digitalis-lendulet:sponsor\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"live-w\" data-h=\"96|64\">–\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"ad sp\">\u003cspan class=\"sp-lbl\">A program támogatója\u003c/span>\u003cspan class=\"sp-logo\">\u003csvg fill=\"none\" stroke=\"#e0594c\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.9\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 3v17M7 20h10M5 7h14\">\u003c/path>\u003cpath d=\"M5 8l-3 6a3 3 0 0 0 6 0zM19 8l-3 6a3 3 0 0 0 6 0z\">\u003c/path>\u003c/svg>Mérlegelő\u003c/span>\u003cspan class=\"sp-txt\">Felhőalapú könyvelés és pénzügyi áttekintés.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"prose\">\u003cp class=\"kick\">A programról\u003c/p>\u003ch2>Nem technológiai kérdés — üzleti\u003c/h2>\u003cp>A szerkesztőség elkötelezett kommunikációs partnere a vállalkozások digitális szemléletváltásának. Ez a meggyőződésünk nem új: a „Digitális lendület” a lap 2018. novemberi vezércikkének a címe volt — most ez lett annak a programnak a neve, amellyel a témát folyamatosan napirenden tartjuk.\u003c/p>\u003cp>A digitalizációról szóló magyar közbeszéd többnyire eszközökről szól: milyen rendszert vezessen be egy cég, milyen pályázatból, mennyiért. A vállalkozó viszont nem rendszert akar, hanem eredményt. Ez az oldal ezért egyetlen kérdés köré rendezi az anyagainkat: mitől lesz egy digitális eszközből üzleti eredmény?\u003c/p>\u003cblockquote>A következő nagy kérdés már nem az, hány digitális rendszert használ egy vállalkozás, hanem az, hogy ezek hogyan járulnak hozzá az üzleti eredményhez.\u003c/blockquote>\u003ch3>Három tétel, amit a programban képviselünk\u003c/h3>\u003c/div>\u003cdiv class=\"feat f3\">\u003cdiv>\u003ch3>Az eszköz nem jelenlét\u003c/h3>\u003cp>Attól, hogy egy cégnek van honlapja és közösségi oldala, még nem biztos, hogy jelen van a piacán.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>A lemaradás nem sorsszerű\u003c/h3>\u003cp>Uniós összevetésben a hazai KKV-szektor több mutatóban hátul van. Ez nem ítélet, hanem kiindulópont.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>A következő lépés az értékesítés\u003c/h3>\u003cp>A pénzügyi és adminisztratív digitalizáció nagyrészt megtörtént. A következő szakasz az értékesítés.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"note\">Az itt hivatkozott adatok forrásait a téma vezércikkénél tüntetjük fel.\u003c/p>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>A téma a rovatokban\u003c/h4>\u003cp>A digitalizáció keresztbe fekszik a rovatokon — az anyagok a saját helyükön maradnak, ez az oldal egy helyre gyűjti őket.\u003c/p>\u003cul>\u003cli>\u003cspan>Gazdaság\u003c/span>\u003cspan class=\"cnt\">3\u003c/span>\u003c/li>\u003cli>\u003cspan>Európai Unió\u003c/span>\u003cspan class=\"cnt\">1\u003c/span>\u003c/li>\u003cli>\u003cspan>GmÉlet\u003c/span>\u003cspan class=\"cnt\">1\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>Vállalkozóihíd\u003c/h4>\u003cp>A magazin kiemelt projektje: kommunikációs híd a KKV-k, a nagyvállalatok és a döntéshozók között — és a vállalkozók között egymással.\u003c/p>\u003ca class=\"more\" data-p=\"vallalkozoihid\">A Vállalkozóihídról\u003c/a>\u003c/div>\u003cdiv class=\"wg box\">\u003ch4>Van tapasztalata?\u003c/h4>\u003cp>Ha a cégénél volt olyan digitális fejlesztés, amelynek mérhető üzleti eredménye lett — vagy éppen nem lett —, arról szívesen írnánk.\u003c/p>\u003ca class=\"btn ghost\" data-p=\"kapcsolat\">Írok a szerkesztőségnek\u003c/a>\u003c/div>\u003cdiv class=\"slot sticky\" data-slot=\"digitalis-lendulet:side\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm ct\">300 × 250\u003cem>Medium rectangle\u003c/em>\u003c/span>\u003cspan class=\"cd\">300 × 600\u003cem>Half page, rögzül\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm ct\">\u003ca class=\"ad ml ml-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"ml-logo\">\u003csvg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.9\" viewBox=\"0 0 24 24\">\u003cpath d=\"M 003c/i>\u003ci>e-kereskedelem\u003c/i>\u003ci>kiberbiztonság\u003c/i>\u003ci>uniós források\u003c/i>\u003c/span>\u003cspan class=\"fo-row\">\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003cspan class=\"fo-note\">Kedvezményes jegyek október 15-ig\u003c/span>\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap alt\">\u003cp class=\"kick\">Anyagaink a témában\u003c/p>\u003ch2 class=\"h2\">Amit eddig írtunk\u003c/h2>\u003cp class=\"intro\">A programhoz eddig 5 anyag készült el, 3 rovatban. A lista folyamatosan bővül.\u003c/p>\u003cdiv class=\"cards c3\">\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-800.webp\"/>\u003cspan class=\"topic\">Vállalkozásfejlesztés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003c/p>\u003ch3 data-p=\"cikk\">Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\u003c/h3>\u003cp class=\"lead\">Van honlap, közösségi média és egyre több digitális eszköz. A magyar kis- és középvállalkozások egyik következő nagy feladata mégis az lehet, hogy a digitális jelenlétből valódi piaci jelenlétet építsenek.\u003c/p>\u003cp class=\"by\">Óvári László interjúja Magdó Emillel\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/promise-group-800.webp\"/>\u003cspan class=\"topic\">Vállalkozásfejlesztés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003c/p>\u003ch3 data-p=\"cikk\">Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\u003c/h3>\u003cp class=\"lead\">A vállalatok ma már nem csupán licenceket keresnek, hanem olyan technológiai partnereket, amelyek a felhőszolgáltatásoktól az AI-megoldásokon át a kiberbiztonságig képesek támogatni digitális fejlődésüket.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Digitalizáció — a versenyképességünk záloga\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/infoparlament-800.webp\"/>\u003cspan class=\"topic\">Rendezvények, konferenciák\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">GmÉlet\u003c/p>\u003ch3 data-p=\"cikk\">Digitalizáció — a versenyképességünk záloga\u003c/h3>\u003cp class=\"lead\">Az Infóparlament átfogó, magas szintű egyeztető fórum a kormányzat, a piac, a civil és az oktatási szektor részvételével.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-800.webp\"/>\u003cspan class=\"topic\">Munkaerő és képzés\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Gazdaság\u003cspan class=\"flag\">Ami igaz, az igaz\u003c/span>\u003c/p>\u003ch3 data-p=\"cikk\">Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\u003c/h3>\u003cp class=\"lead\">A norvég döntés valódi. Az viszont, ami belőle a magyar vállalkozóhoz megérkezik — „az MI káros, várjunk vele” —, már nem az, amit a norvég kormány mondott. Megnéztük, mi a hír, mi van mögötte, és mit érdemes kezdeni vele egy ötfős cégben.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003carticle class=\"card\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Díjmentes digitális fejlesztési koncepció — idén még elérhető\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/fejlesztesi-tamogatasok-800.webp\"/>\u003cspan class=\"topic\">Fejlesztési források\u003c/span>\u003c/span>\u003c/a>\u003cp class=\"meta\">Európai Unió\u003cspan class=\"flag\">Kézzelfogható\u003c/span>\u003c/p>\u003ch3 data-p=\"cikk\">Díjmentes digitális fejlesztési koncepció — idén még elérhető\u003c/h3>\u003cp class=\"lead\">Létezik egy uniós forrásból működő szolgáltatás, amely felméri, hol tart a cége digitálisan, és leírja, mibe érdemes belevágni. Nem kerül pénzbe, és 2026 végén lezárul. Összeszedtük, kinek jár, hogyan lehet hozzájutni, és hol szokott elakadni.\u003c/p>\u003cp class=\"by\">EUGM szerkesztőség\u003c/p>\u003c/article>\u003cdiv class=\"slot-fl\" data-slot=\"digitalis-lendulet:native\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"live-w\" data-h=\"card\">–\u003c/span>\u003c/span>\u003c/div>\u003ca class=\"ad card card-nat\">\u003cspan class=\"ph\">\u003csvg preserveAspectRatio=\"xMidYMid slice\" viewBox=\"0 0 320 180\">\u003crect fill=\"#ffc862\" height=\"180\" width=\"320\">\u003c/rect>\u003crect fill=\"#e9ad4f\" height=\"62\" width=\"320\" y=\"118\">\u003c/rect>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" r=\"26\">\u003c/circle>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" fill-opacity=\".3\" r=\"38\">\u003c/circle>\u003cpolygon fill=\"#26435e\" points=\"40,172 110,112 290,112 250,172\">\u003c/polygon>\u003cg fill=\"none\" stroke=\"#8fb3d6\" stroke-width=\"1.3\">\u003cpath d=\"M86.7 132H276.7M63.3 152H263.3M82 172L146 112M124 172L182 112M166 172L218 112M208 172L254 112\">\u003c/path>\u003c/g>\u003c/svg>\u003c/span>\u003cspan class=\"nat-in\">\u003cspan class=\"nat-chip\">Szponzorált tartalom\u003c/span>\u003cb class=\"nat-t\">Harmadával kisebb energiaszámla: így számolt egy kecskeméti pékség\u003c/b>\u003cspan class=\"nat-l\">Tetőre szerelt napelem, okos mérés és egy tizenkét éves konstrukció. A tulajdonos elmondja, mikor térül ar Pro\u003c/span>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan class=\"pr-sub\">24 órán belül értesítjük, szakértői összefoglalóval és határidő-naptárral.\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cp class=\"kick\">Induló tartalmaink\u003c/p>\u003ch2 class=\"h2\">9 cikk\u003c/h2>\u003cp class=\"intro\">A portál most indul, ezért a cikkállomány szándékosan szűk: azokat az anyagokat tettük ki, amelyeket a szerkesztőség a webre készített. A lista folyamatosan bővül.\u003c/p>\u003cdiv class=\"hl-list\">\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Gazdaság\u003c/b> · Vállalkozásfejlesztés · Óvári László interjúja Magdó Emillel\u003c/p>\u003ch3 data-p=\"cikk\">Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\u003c/h3>\u003cp>Van honlap, közösségi média és egyre több digitális eszköz. A magyar kis- és középvállalkozások egyik következő nagy feladata mégis az lehet, hogy a digitális jelenlétből valódi piaci jelenlétet építsenek.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/promise-group-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Gazdaság\u003c/b> · Vállalkozásfejlesztés · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\u003c/h3>\u003cp>A vállalatok ma már nem csupán licenceket keresnek, hanem olyan technológiai partnereket, amelyek a felhőszolgáltatásoktól az AI-megoldásokon át a kiberbiztonságig képesek támogatni digitális fejlődésüket.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Európa-élményközpont Budapest szívében\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/europa-elmenykozpont-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Európai Unió\u003c/b> · Uniós intézmények · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Európa-élményközpont Budapest szívében\u003c/h3>\u003cp>Kétezer négyzetméteres multimédiás tér, 360 fokos mozi és szerepjáték arról, milyen európai parlamenti képviselőnek lenni.\u003c/p>\u003c/div>\u003c/article>\u003cdiv class=\"slot\" data-slot=\"hirek:infeed\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">300 × 250\u003cem>Medium rectangle, in-read\u003c/em>\u003c/span>\u003cspan class=\"ct cd\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad pb pb-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pb-arcs\">\u003c/span>\u003cspan class=\"pb-logo\">\u003csvg viewBox=\"0 0 24 24\">\u003crect fill=\"#d4f36a\" height=\"24\" rx=\"6\" width=\"24\">\u003c/rect>\u003cpath d=\"M4 15c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003cpath d=\"M4 10c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" opacity=\".5\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003c/svg>Pannonhitel\u003c/span>\u003cb class=\"pb-h\">Fix kamat.\u003cbr/>A futamidő végéig.\u003c/b>\u003cspan class=\"pb-sub\">KKV Beruházási Hitel\u003cbr/>5–150 millió forintig\u003c/span>\u003cspan class=\"pb-cta\">Kiszámolom\u003c/span>\u003cspan class=\"pb-legal\">Tájékoztató jellegű, nem minősül ajánlattételnek.\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct cd\">\u003ca class=\"ad pb pb-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"pb-arcs\">\u003c/span>\u003cspan class=\"pb-logo\">\u003csvg viewBox=\"0 0 24 24\">\u003crect fill=\"#d4f36a\" height=\"24\" rx=\"6\" width=\"24\">\u003c/rect>\u003cpath d=\"M4 15c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003cpath d=\"M4 10c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" opacity=\".5\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003c/svg>Pannonhitel\u003c/span>\u003cspan class=\"pb-txt\">\u003cb>Fix kamat a futamidő végéig\u003c/b>\u003cspan>KKV Beruházási Hitel 5–150 millió forintig\u003c/span>\u003c/span>\u003cspan class=\"pb-cta\">Kiszámolom\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Az Európai Parlament kapcsolattartó irodái\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/ep-irodak-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Európai Unió\u003c/b> · Uniós intézmények · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Az Európai Parlament kapcsolattartó irodái\u003c/h3>\u003cp>Az uniós intézmények helyi jelenléte nem protokoll: kézzelfogható belépési pont a jogszabályi környezethez és a pályázati lehetőségekhez.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"„Nálunk a család az első” — a Fantasy Land mesevilág\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/fantasy-land-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Vállalkozóihíd\u003c/b> · Családi vállalkozás · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">„Nálunk a család az első” — a Fantasy Land mesevilág\u003c/h3>\u003cp>Beszélgetés Juhász-Orbán Líviával a családbarát vállalkozás megálmodásáról és működtetéséről.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Digitalizáció — a versenyképességünk záloga\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/infoparlament-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>GmÉlet\u003c/b> · Rendezvények, konferenciák · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Digitalizáció — a versenyképességünk záloga\u003c/h3>\u003cp>Az Infóparlament átfogó, magas szintű egyeztető fórum a kormányzat, a piac, a civil és az oktatási szektor részvételével.\u003c/p>\u003c/div>\u003c/article>\u003cdiv class=\"slot-fl\" data-slot=\"hirek:native\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"live-w\" data-h=\"row\">–\u003c/span>\u003c/span>\u003c/div>\u003ca class=\"ad natw nat-row\">\u003cspan class=\"ph\">\u003csvg preserveAspectRatio=\"xMidYMid slice\" viewBox=\"0 0 320 180\">\u003crect fill=\"#ffc862\" height=\"180\" width=\"320\">\u003c/rect>\u003crect fill=\"#e9ad4f\" height=\"62\" width=\"320\" y=\"118\">\u003c/rect>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" r=\"26\">\u003c/circle>\u003ccircle cx=\"252\" cy=\"50\" fill=\"#fff4cf\" fill-opacity=\".3\" r=\"38\">\u003c/circle>\u003cpolygon fill=\"#26435e\" points=\"40,172 110,112 290,112 250,172\">\u003c/polygon>\u003cg fill=\"none\" stroke=\"#8fb3d6\" stroke-width=\"1.3\">\u003cpath d=\"M86.7 132H276.7M63.3 152H263.3M82 172L146 112M124 172L182 112M166 172L218 112M208 172L254 112\">\u003c/path>\u003c/g>\u003c/svg>\u003c/span>\u003cspan class=\"nat-in\">\u003cspan class=\"nat-chip\">Szponzorált tartalom\u003c/span>\u003cb class=\"nat-t\">Harmadával kisebb energiaszámla: így számolt egy kecskeméti pékség\u003c/b>\u003cspan class=\"nat-l\">Tetőre szerelt napelem, okos mérés és egy tizenkét éves konstrukció. A tulajdonos elmondja, mikor térült meg a beruházás.\u003c/span>\u003cspan class=\"nat-by\">Partnerünk: Napfény Energia Zrt.\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"„Ahogy azt már partnereink megszokhatták…” — Alphasonic Expo\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/alphasonic-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>GmÉlet\u003c/b> · Rendezvények, konferenciák · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">„Ahogy azt már partnereink megszokhatták…” — Alphasonic Expo\u003c/h3>\u003cp>Informatikai és biztonságtechnikai szakmai partnernap közel 30 gyártói standdal.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Gazdaság\u003c/b> · Munkaerő és képzés · Ami igaz, az igaz · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\u003c/h3>\u003cp>A norvég döntés valódi. Az viszont, ami belőle a magyar vállalkozóhoz megérkezik — „az MI káros, várjunk vele” —, már nem az, amit a norvég kormány mondott. Megnéztük, mi a hír, mi van mögötte, és mit érdemes kezdeni vele egy ötfős cégben.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"hl\">\u003ca data-p=\"cikk\">\u003cspan class=\"im\">\u003cimg alt=\"Díjmentes digitális fejlesztési koncepció — idén még elérhető\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/fejlesztesi-tamogatasok-420.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003cp class=\"meta\">\u003cb>Európai Unió\u003c/b> · Fejlesztési források · Kézzelfogható · EUGM szerkesztőség\u003c/p>\u003ch3 data-p=\"cikk\">Díjmentes digitális fejlesztési koncepció — idén még elérhető\u003c/h3>\u003cp>Létezik egy uniós forrásból működő szolgáltatás, amely felméri, hol tart a cége digitálisan, és leírja, mibe érdemes belevágni. Nem kerül pénzbe, és 2026 végén lezárul. Összeszedtük, kinek jár, hogyan lehet hozzájutni, és hol szokott elakadni.\u003c/p>\u003c/div>\u003c/article>\u003c/div>\u003cdiv class=\"wg box\" style=\"margin-top:26px\">\u003ch4>Hamarosan több\u003c/h4>\u003cp>A szerkesztőség folyamatosan dolgozik az új anyagokon. Ha szeretné, hogy értesítsük róluk, iratkozzon fel az eugmonline hírlevélre.\u003c/p>\u003ca class=\"btn\" data-p=\"index\">Feliratkozom a hírlevélre\u003c/a>\u003c/div>\u003c/div>\u003caside>\u003cdiv class=\"slot\" data-slot=\"hirek:podcast\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">320 × 100\u003cem>Podcast-sáv\u003c/em>\u003c/span>\u003cspan class=\"ct cd\">300 × 250\u003cem>Podcast-kártya\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003cdiv class=\"ad pod pod-mb\" data-bars=\"30\" style=\"width:320px;height:100px\">\u003cspan aria-hidden=\"true\" class=\"pod-cover\">\u003cb>Adó\u003cbr/>radar\u003c/b>\u003c/span>\u003cdiv class=\"pod-r\">\u003cspan class=\"pod-meta\">\u003csmall>Podcast, támogató: Kvadráns\u003c/small>\u003cb>Mi változik 2027-ben az áfában?\u003c/b>\u003c/span>\u003cdiv class=\"pod-ctl\">\u003cbutton aria-label=\"Részlet lejátszása\" class=\"pod-play\" type=\"button\">\u003csvg class=\"i-play\" viewBox=\"0 0 24 24\">\u003cpath d=\"M6 3.5v17l15-8.5z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003csvg class=\"i-pause\" viewBox=\"0 0 24 24\">\u003cpath d=\"M6 4h4.5v16H6zM13.5 4H18v16h-4.5z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv aria-hidden=\"true\" class=\"pod-wave\">\u003c/div>\u003cspan class=\"p >KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · AI, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"cd\">\u003ca class=\"ad fo fo-lb\" style=\"width:970px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · mesterséges intelligencia, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-note\">Kedvezményes jegyek\u003cbr/>október 15-ig\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>","p:cikk":"\u003cdiv class=\"p-hero\">\u003cspan class=\"im\">\u003cimg alt=\"Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-1400.webp\"/>\u003c/span>\u003c/div>\u003cheader class=\"p-head wrap\">\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / \u003ca data-p=\"gazdasag\">Gazdaság\u003c/a>\u003c/p>\u003ch1 class=\"p-h1\">Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\u003c/h1>\u003cp class=\"p-desc\">Van honlap, közösségi média és egyre több digitális eszköz. A magyar kis- és középvállalkozások egyik következő nagy feladata mégis az lehet, hogy a digitális jelenlétből valódi piaci jelenlétet építsenek.\u003c/p>\u003cp class=\"art-meta\">\u003cb>Gazdaság\u003c/b>\u003cspan>Vállalkozásfejlesztés\u003c/span>\u003cspan>Óvári László interjúja Magdó Emillel\u003c/span>\u003c/p>\u003c/header>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003carticle>\u003cdiv class=\"art-img\">\u003cspan class=\"im\">\u003cimg alt=\"Fent vagyunk az interneten — de a piacunkon is jelen vagyunk?\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/digitalis-gazdasag-2-1400.webp\"/>\u003c/span>\u003c/div>\u003cdiv class=\"prose\">\u003cp class=\"q\">A magyar vállalkozások digitalizációjáról sok szó esik. Ön mégis azt mondja, hogy marketing szempontból a digitális jelenlét ma is elhanyagolt terület. Mire gondol pontosan?\u003c/p>\u003cp>Elsősorban arra, hogy két különböző dolgot gyakran összekeverünk. Az egyik a digitális eszközök megléte, a másik a digitális piaci jelenlét. Egy vállalkozásnak lehet weboldala, Facebook-oldala, Google Cégprofilja, hírlevélrendszere, sőt hirdethet is. Ettől még nem biztos, hogy a digitális tér valóban támogatja az ügyfélszerzését és az értékesítését.\u003c/p>\u003cp>A Digiméter 2024-es kutatásában például a vizsgált hazai KKV-k 72 százalékának volt honlapja. Ugyanakkor az „Értékesítés és marketing” alindex mindössze 14 pontot ért el a százfokú skálán. A cégek fele egyáltalán nem hirdetett, 70 százalékuk pedig semmilyen formában nem értékesített interneten keresztül.\u003c/p>\u003cp>Ez nagyon jól mutatja a különbséget aközött, hogy egy vállalkozás „fent van” az interneten, vagy a digitális jelenléte valóban üzleti funkciót tölt be.\u003c/p>\u003cp class=\"q\">Akkor nem elsősorban technológiai lemaradásról beszélünk?\u003c/p>\u003cp>Részben természetesen arról is. Az Európai Bizottság 2026-os országjelentése szerint Magyarország továbbra is lemaradásban van az üzleti digitalizáció és a kulcsfontosságú technológiák elterjedése terén, különösen a KKV-k esetében. Az Eurostat adatai szerint 2025-ben az uniós vállalkozások 63,6 százaléka használt valamilyen közösségi médiát, Magyarországon ez az arány 47,3 százalék volt. Ennél csak két uniós országban mértek alacsonyabb értéket.\u003c/p>\u003cp>A technológia megléte azonban önmagában még nem oldja meg a problémát. Érdekes, hogy a Digiméterben a digitális pénzügyek 65 pontot értek el, miközben az értékesítés és marketing csak 14-et. Vagyis sok vállalkozás megtanulta használni az internetbankot, az elektronikus számlát és a digitális pénzügyi szolgáltatásokat. A digitális piacra jutásban viszont jóval kisebb az előrelépés.\u003c/p>\u003cdiv class=\"slot\" data-slot=\"cikk:inart1\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">300 × 250\u003cem>Medium rectangle, in-read\u003c/em>\u003c/span>\u003cspan class=\"ct cd\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad pr pr-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pr-radar r-l\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-name\">PályázatRadar Pro\u003c/span>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan class=\"pr-sub\">24 órán belül értesítjük, szakértői összefoglalóval.\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct cd\">\u003ca class=\"ad pr pr-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"pr-radar r-s\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"pr-txt\">\u003csmall>PályázatRadar Pro\u003c/small>\u003cb>Új uniós kiírás jelent meg az Ön ágazatában?\u003c/b>\u003cspan>24 órán belül értesítjük, szakértői összefoglalóval.\u003c/span>\u003c/span>\u003cspan class=\"pr-cta\">14 napig ingyen\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cp class=\"q\">Miért lehet ekkora különbség?\u003c/p>\u003cp>A pénzügyi és adminisztratív digitalizáció sok esetben kézzelfogható előnyt vagy közvetlen kényszert hozott: gyorsabb lett, egyszerűbb, bizonyos esetekben pedig előírások terelték ebbe az irányba a cégeket. A marketing másképpen működik. Ott a vállalkozásnak magának kell felismernie, hogy mitől válik számára értékessé egy digitális eszköz.\u003c/p>\u003cp>Sokszor még mindig eszközökben gondolkodunk. Kell egy új honlap. Kell Facebook. Kell LinkedIn. Kell keresőoptimalizálás. Kell hirdetés. A vevő azonban nem ezekből indul ki. Ő egy problémát akar megoldani. Lehet, hogy keres a Google-ben, ajánlást kér, megnéz néhány céget, elolvas értékeléseket, összehasonlítja a referenciákat, videókat néz, vagy ma már egy mesterségesintelligencia-alapú szolgáltatást kérdez meg. A vállalkozásnak ebben a döntési folyamatban kell jelen lennie.\u003c/p>\u003cp class=\"q\">Tehát a weboldal jelentősége csökken?\u003c/p>\u003cp>Inkább a szerepe változik. Továbbra is nagyon fontos, csak már nem önmagában kell nézni. Korábban leegyszerűsítve úgy működött a folyamat, hogy valaki rákeresett egy szolgáltatásra, eljutott a weboldalra, majd kapcsolatba lépett a céggel. Ma egy potenciális ügyfél sok apró találkozásból állítja össze a véleményét. Lát egy szakmai cikket, találkozik egy közösségimédia-bejegyzéssel, megnézi a Google-értékeléseket, elolvassa a referenciákat, majd lehet, hogy hetekkel később újra rákeres a cégre. Ezek a digitális nyomok együtt alakítják ki, mit gondol a vállalkozásról.\u003c/p>\u003cblockquote>A digitális jelenlét ma már sokkal inkább egymással összekapcsolódó információk, benyomások és bizonyítékok rendszere.\u003c/blockquote>\u003cp class=\"q\">Mit jelent ez egy KKV vezetője számára a gyakorlatban?\u003c/p>\u003cdiv class=\"slot\" data-slot=\"cikk:inart2\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">300 × 250\u003cem>Medium rectangle, in-read\u003c/em>\u003c/span>\u003cspan class=\"ct cd\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad fo fo-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-r\">\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · AI, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct cd\">\u003ca class=\"ad fo fo-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · AI, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cp>Azt, hogy más kérdéseket érdemes feltennie. Nem azt, hogy van-e weboldalunk, hanem azt, hogy megtalálnak-e bennünket akkor, amikor szükség van arra, amit kínálunk. Nem azt, hogy hány látogatónk van, hanem hogy kik érkeznek, milyen problémával és mit tesznek utána. Nem pusztán azt, hogy rendszeresen posztolunk-e, hanem azt, hogy a tartalmaink segítik-e a lehetséges ügyfelet a vásárlási döntésében.\u003c/p>\u003cp>A digitális jelenlét akkor kezd valódi üzleti eszközzé válni, amikor kapcsolatot teremt egy konkrét vevő helyzete és a vállalkozás megoldása között. Ez azért is lényeges, mert a láthatóság önmagában félrevezető lehet: egy cégnek például lehet tízezer honlaplátogatója úgy, hogy alig érkezik értékes megkeresés. Egy másiknak lehet néhány száz látogatója, de ha ők pontosan azt a speciális szolgáltatást keresik, amelyet a cég nyújt, az üzleti eredmény sokkal jobb lehet. Nem feltétlenül a figyelem mennyisége, hanem a relevanciája a döntő.\u003c/p>\u003cp class=\"q\">A mesterséges intelligencia mennyiben változtat ezen?\u003c/p>\u003cp>Jelentősen. Eddig elsősorban arra kellett figyelnünk, hogy egy ember megtalálja és megértse a vállalkozást. Most megjelent egy új közvetítő réteg is. Egyre többen kérdeznek AI-alapú keresőket és asszisztenseket arról, milyen szolgáltatást válasszanak, milyen cégek jöhetnek szóba, vagy mire érdemes figyelniük egy döntésnél. Ez új követelményt jelent. Nem elég, hogy egy weboldal önmagában szép: a vállalkozásról elérhető információnak pontosnak, következetesnek és bizonyíthatónak kell lennie. Egyértelműen ki kell derülnie, mivel foglalkozik a cég, milyen problémákat old meg, kik számára releváns, milyen tapasztalata van, és milyen referenciák támasztják ezt alá.\u003c/p>\u003cp>Fontos kiemelni, hogy ebben a kisebb vállalkozásoknak is komoly lehetőségük van. Egy KKV nem tud mindenben nagyobb lenni egy multinacionális cégnél, de egy szűk szakterületen lehet pontosabb, érthetőbb, gyorsabb és relevánsabb.\u003c/p>\u003cdiv class=\"slot\" data-slot=\"cikk:video\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">320 × 180\u003cem>Videó 16:9\u003c/em>\u003c/span>\u003cspan class=\"ct\">720 × 405\u003cem>Videó 16:9\u003c/em>\u003c/span>\u003cspan class=\"cd\">800 × 450\u003cem>Videó 16:9\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"vid\">\u003cdiv class=\"vid-scene\">\u003cdiv class=\"vid-title\">\u003cspan class=\"vid-kick\">Videópodcast, 3. rész\u003c/span>\u003cb>Német piac, magyar termék: hogyan jut be egy KKV?\u003c/b>\u003cspan class=\"vid-guest\">Vendég: Szabó Balázs exportmenedzser\u003c/span>\u003cspan class=\"vid-cta\">Teljes epizód\u003c/span>\u003c/div>\u003cdiv aria-hidden=\"true\" class=\"vid-set\">\u003cspan class=\"vid-av a1\">KD\u003c/span>\u003cspan class=\"vid-av a2\">SB\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"vid-badge\">Hirdetés\u003c/span>\u003cspan class=\"vid-brand\">\u003csvg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"2.2\" viewBox=\"0 0 24 24\">\u003cpath d=\"M2 17c4-8 16-8 20 0M6 17v-4M12 17v-6M18 17v-4M2 17h20\">\u003c/path>\u003c/svg>ExportHíd\u003c/span>\u003cbutton aria-label=\"Hirdetés lejátszása\" class=\"vid-big\" type=\"button\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M6 3.5v17l15-8.5z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\u003cbutton class=\"vid-skip\" disabled=\"\" type=\"button\">Kihagyható 5 mp múlva\u003c/button>\u003cdiv class=\"vid-ctrl\">\u003cbutton aria-label=\"Lejátszás vagy szünet\" class=\"vid-pp\" type=\"button\">\u003csvg class=\"i-play\" viewBox=\"0 0 24 24\">\u003cpath d=\"M8 5.5v13l11-6.5z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003csvg class=\"i-pause\" viewBox=\"0 0 24 24\">\u003cpath d=\"M7 5h3.5v14H7zM13.5 5H17v14h-3.5z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\u003cspan class=\"vid-bar\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"vid-time\">0:00 / 0:30\u003c/span>\u003cbutton aria-label=\"Hang be vagy ki\" class=\"vid-mute\" type=\"button\">\u003csvg class=\"i-off\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 9v6h4l5 4V5L7 9z\" fill=\"currentColor\" stroke=\"none\">\u003c/path>\u003cpath d=\"M16 9l5 6M21 9l-5 6\">\u003c/path>\u003c/svg>\u003csvg class=\"i-on\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 9v6h4l5 4V5L7 9z\" fill=\"currentColor\" stroke=\"none\">\u003c/path>\u003cpath d=\"M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"q\">Vagyis nem feltétlenül több marketingre lenne szükség?\u003c/p>\u003cp>Sok esetben éppen ez az egyik félreértés. Nem biztos, hogy több poszt, több hirdetés vagy több tartalom kell. Mindenekelőtt pontosabban kell látni, kik a valóban fontos ügyfelek, milyen helyzetekben kezdenek megoldást keresni, milyen bizonytalanságaik vannak, és milyen információ szükséges ahhoz, hogy tovább tudjanak lépni. Ha ezt nem tudjuk, akkor a digitális marketing könnyen folyamatos tartalomgyártássá és médiavásárlássá válik — egyfajta digitális tartalomgyártó „rabszolgává” válunk. Ha viszont értjük a vevő döntési helyzetét, akkor a weboldal, a kereső, a közösségi média, a videó, a szakmai cikk és akár az értékesítő munkája is ugyanannak a rendszernek a részévé válik.\u003c/p>\u003cp class=\"q\">Mi lehet akkor a magyar KKV-k következő nagy digitális feladata?\u003c/p>\u003cp>Az Európai Unió célja, hogy 2030-ra a KKV-k több mint 90 százaléka érje el legalább az alapvető digitális intenzitási szintet. 2025-ben az uniós KKV-k 71 százaléka tartozott ebbe a körbe. A technológiai fejlődés tehát biztosan folytatódik. Szerintem azonban a következő nagy kérdés már nem egyszerűen az lesz, hány digitális rendszert használ egy vállalkozás, hanem az, hogy ezek hogyan járulnak hozzá az üzleti eredményhez.\u003c/p>\u003cp>A magyar KKV-k következő digitalizációs feladata ezért nem feltétlenül egy újabb platform bevezetése vagy egy újabb weboldal elkészítése. Sokkal inkább az, hogy a vállalkozás a digitális jelenlétet az értékesítési rendszere részeként kezelje. A vállalkozásnak ott kell jelen lennie, ahol a vevő tájékozódik, akkor kell érthető választ adnia, amikor a kérdés megszületik, majd annyi bizonyítékot kell felmutatnia, amennyi a következő lépéshez szükséges.\u003c/p>\u003cblockquote>Ma már szinte minden vállalkozás hagy valamilyen nyomot az interneten. A verseny ezért egyre kevésbé arról szól, hogy ki van fent a digitális térben — sokkal inkább arról, hogy kit vesznek észre, kit értenek meg, és végül kiben bíznak meg.\u003c/blockquote>\u003c/div>\u003cdiv class=\"backlinks\">\u003ca class=\"more\" data-p=\"gazdasag\">← Gazdaság rovat\u003c/a>\u003ca class=\"more\" data-p=\"hirek\">Friss a portálon\u003c/a>\u003c/div>\u003c/article>\u003caside>\u003cdiv class=\"slot\" data-slot=\"cikk:side2\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm ct cd\">300 × 250\u003cem>Medium rectangle\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm ct cd\">\u003ca class=\"ad pb pb-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pb-arcs\">\u003c/span>\u003cspan class=\"pb-logo\">\u003csvg viewBox=\"0 0 24 24\">\u003crect fill=\"#d4f36a\" height=\"24\" rx=\"6\" width=\"24\">\u003c/rect>\u003cpath d=\"M4 15c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003cpath d=\"M4 10c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" opacity=\".5\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003c/svg>Pannonhitel\u003c/span>\u003cb class=\"pb-h\">Fix kamat.\u003cbr/>A futamidő végéig.\u003c/b>\u003cspan class=\"pb-sub\">KKV Beruházási Hitel\u003cbr/>5–150 millió forintig\u003c/span>\u003cspan class=\"pb-cta\">Kiszámolom\u003c/span>\u003cspan class=\"pb-legal\">Tájékoztató jellegű, nem minősül ajánlattételnek.\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Hivatkozott források\u003c/h4>\u003cul>\u003cli>\u003cspan>Digiméter 2024 — sajtóközlemény\u003c/span>\u003c/li>\u003cli>\u003cspan>Európai Bizottság — Magyarország 2026-os digitális évtized országjelentése\u003c/span>\u003c/li>\u003cli>\u003cspan>Eurostat — közösségimédia-használat a vállalkozásoknál\u003c/span>\u003c/li>\u003cli>\u003cspan>Eurostat — Digitalisation 2026\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>További anyagaink\u003c/h4>\u003cul>\u003cli>\u003cspan data-p=\"cikk\">Mesterséges intelligencia és felhő: átrendeződik a hazai IT-piac\u003c/span>\u003c/li>\u003cli>\u003cspan data-p=\"cikk\">Norvégia kivezeti az MI-t az alsó tagozatból — és ez miért nem Önről szól\u003c/span>\u003c/li>\u003cli>\u003cspan data-p=\"cikk\">Európa-élményközpont Budapest szívében\u003c/span>\u003c/li>\u003cli>\u003cspan data-p=\"cikk\">Az Európai Parlament kapcsolattartó irodái\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"wg\">\u003ch4>Témák\u003c/h4>\u003cdiv class=\"tags\">\u003cspan>digitalizáció\u003c/span>\u003cspan>KKV\u003c/span>\u003cspan>online marketing\u003c/span>\u003cspan>mesterséges intelligencia\u003c/span>\u003cspan>értékesítés\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"wg bo  172L254 112\">\u003c/path>\u003c/g>\u003c/svg>\u003c/span>\u003cspan class=\"nat-in\">\u003cspan class=\"nat-chip\">Szponzorált tartalom\u003c/span>\u003cb class=\"nat-t\">Harmadával kisebb energiaszámla: így számolt egy kecskeméti pékség\u003c/b>\u003cspan class=\"nat-l\">Tetőre szerelt napelem, okos mérés és egy tizenkét éves konstrukció. A tulajdonos elmondja, mikor térült meg a beruházás.\u003c/span>\u003cspan class=\"nat-by\">Partnerünk: Napfény Energia Zrt.\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003c/section>\u003cdiv class=\"s-slot wrap\">\u003cdiv class=\"slot\" data-slot=\"cikk:foot\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm\">320 × 100\u003cem>Nagy mobil banner\u003c/em>\u003c/span>\u003cspan class=\"ct\">728 × 90\u003cem>Leaderboard\u003c/em>\u003c/span>\u003cspan class=\"cd\">970 × 90\u003cem>Super leaderboard\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm\">\u003ca class=\"ad fo fo-mb\" style=\"width:320px;height:100px\">\u003cspan class=\"fo-date\">\u003csmall>nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>2026\u003c/small>\u003c/span>\u003cspan class=\"fo-r\">\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest, 30 előadó\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"ct\">\u003ca class=\"ad fo fo-lb\" style=\"width:728px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · AI, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"cd\">\u003ca class=\"ad fo fo-lb\" style=\"width:970px;height:90px\">\u003cspan class=\"fo-date\">\u003csmall>2026. nov.\u003c/small>\u003cb>12\u003c/b>\u003csmall>csütörtök\u003c/small>\u003c/span>\u003cspan class=\"fo-t\">\u003cb>KKV Digitalizációs Fórum 2026\u003c/b>\u003cspan>Budapest · 30 előadó · mesterséges intelligencia, e-kereskedelem, kiberbiztonság\u003c/span>\u003c/span>\u003cspan class=\"fo-note\">Kedvezményes jegyek\u003cbr/>október 15-ig\u003c/span>\u003cspan class=\"fo-cta\">Regisztrálok\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>","p:magazin-story":"\u003cdiv class=\"p-hero\">\u003cspan class=\"im\">\u003cimg alt=\"Kézfogás egy hídon a Duna felett\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/sikerre-alapozva-1200.webp\"/>\u003c/span>\u003c/div>\u003cheader class=\"p-head wrap\">\u003cdiv>\u003cp class=\"crumb\">\u003ca data-p=\"index\">Főoldal\u003c/a> / Magazin story\u003c/p>\u003ch1 class=\"p-h1\">EUGM Story\u003c/h1>\u003cp class=\"p-desc\">Építjük a magyarországi vállalkozói világ közösségét — 1989 óta.\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"sec wrap\">\u003cdiv class=\"two\">\u003cdiv>\u003cdiv class=\"prose\">\u003cp class=\"kick\">A kezdetektől napjainkig\u003c/p>\u003ch2>Építjük a magyarországi vállalkozói világ közösségét!\u003c/h2>\u003cp>Magazinunk 1989-ben, a rendszerváltás küszöbén \u003cb>Új Gazdasági Magazin\u003c/b> néven lett alapítva. Az indulási stratégia fő feladatának tartotta a műszaki fejlesztési eredmények, az új módszerek, eljárások, korszerű termékek és szolgáltatások, továbbá az újonnan alakult vagy átalakult cégek bemutatását.\u003c/p>\u003cp>A vállalt feladatai közé tartozott a gazdálkodó egységek közötti információcsere gyorsítása is. Nagy örömünkre szolgált, hogy az akkori vállalkozások körében rövid idő alatt elismert és kedvelt médiamegoldásként tudtuk megjelentetni a magazint.\u003c/p>\u003ch2>2004 — Európa itt van, és mi is Európában vagyunk\u003c/h2>\u003cp>Magyarország 2004-ben csatlakozott az Európai Unióhoz, és a teljes jogú tagoknak járó kedvezményeket is célszerű volt kommunikálni. Ebből adódóan 2004-ben a magazin elnevezését \u003cb>Új Európai Gazdasági Magazin\u003c/b> névre változtattuk.\u003c/p>\u003cp>Mivel változó világban éltünk — és ez jelenleg is jellemző —, mi is fejlesztettük a tartalmi megoldásainkat, és elkezdtünk a public relations eszközeire is támaszkodni.\u003c/p>\u003ch2>A digitalizáció útján\u003c/h2>\u003cp>A digitalizáció jegyében szélesítettük a magazin megjelenésének megoldásait: a nyomtatott magazin mellett megjelentettük az online változatot. Ez egy akkor úttörő megoldásként egyfajta lapozható változatban valósult meg. Így lehetőségünk nyílt egy e-mail megoldással támogatni a megjelenést, és perszonalizált formában tudtuk tájékoztatni az olvasókat a magazin megjelenéséről, annak digitális formában való elérhetőségeiről.\u003c/p>\u003cblockquote>Ezt a folyamatot kívánjuk jelen időszakban is folytatni oly módon, hogy kapcsolatot teremtettünk a megújult honlapunkkal.\u003c/blockquote>\u003cp>A \u003cb>Demján Sándor\u003c/b> nevével fémjelzett fejlesztési pályázaton fejlesztési támogatást nyertünk, és így sikerült egy korszerű portál megvalósítása. Ez a portál széles körű információkat képes kommunikálni a gazdaság szereplői felé, és lehetőségünk van a folyamatos fejlesztésre is.\u003c/p>\u003ch2>Az archívum mint érték\u003c/h2>\u003cp>A magazin több mint három évtizede dokumentálja a magyar vállalkozói világ változásait. Ez az anyag ma már önmagában is érték: a lapszámok együtt olvasva megmutatják, hogyan alakult át a hazai gazdaság nyelve és kérdésfeltevése az uniós csatlakozástól a digitális szemléletváltásig.\u003c/p>\u003cp>Ezért a portálon a korábbi lapszámok nem mellékletek, hanem önálló tartalom: teljes terjedelmükben lapozhatók, és téma szerint is kereshetők — de a régi anyagok nem keverednek a portál mai írásaival. A múlt azt mutatja meg, honnan jöttünk; a jelen írásai a Vállalkozóihíd szellemében készülnek.\u003c/p>\u003ch2>Tartalmi stratégiánk iránya\u003c/h2>\u003cp>Tartalmi stratégiánk fejlesztése során meghatározó szerepet kívánunk szánni az uniós vetületet érintő információknak, beleértve a fejlesztési támogatások lehetőségeinek megismertetését is.\u003c/p>\u003cp>A gazdasági folyamatok egyre szükségesebbé teszik a vállalkozások \u003cem>digitális szemléletváltásának\u003c/em> a megvalósítását. Ennek szellemében terveink szerint elindítjuk \u003cb>eugmonline\u003c/b> hírlevelezési szolgáltatásunkat is. A hírlevelek a magazin és a portál objektív, releváns tartalmi anyagaira támaszkodva fognak egy interaktív kommunikációs csatornát képezni.\u003c/p>\u003cblockquote>A rendszerváltási időszakban aktuális volt, és napjainkban is aktuális gondolat: „merjetek nagyot álmodni”.\u003c/blockquote>\u003c/div>\u003cdiv class=\"portrait\">\u003cspan class=\"im\">\u003cimg alt=\"Óvári László\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/images/cikkek/ovari-laszlo-320.webp\"/>\u003c/span>\u003cdiv>\u003cb>Óvári László\u003c/b>\u003cspan>alapító-főszerkesztő\u003c/span>\u003c/div>\u003cp>„… napjainkban is aktuális gondolat: merjetek nagyot álmodni.”\u003c/p>\u003c/div>\u003c/div>\u003caside>\u003cdiv class=\"wg\">\u003ch4>Mérföldkövek\u003c/h4>\u003cdl>\u003cdt>1989\u003c/dt>\u003cdd>alapítás Új Gazdasági Magazin néven\u003c/dd>\u003cdt>2004\u003c/dt>\u003cdd>névváltás, európai fókusz\u003c/dd>\u003cdt>2010-es évek\u003c/dt>\u003cdd>lapozható online kiadás\u003c/dd>\u003cdt>2026\u003c/dt>\u003cdd>új portál a Demján Sándor Program támogatásával\u003c/dd>\u003c/dl>\u003c/div>\u003cdiv class=\"slot\" data-slot=\"magazin-story:side2\">\u003cdiv class=\"slot-hd\">\u003cspan class=\"ad-lbl\">Hirdetés\u003c/span>\u003cspan class=\"dim\">\u003cspan class=\"cm ct cd\">300 × 250\u003cem>Medium rectangle\u003c/em>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"cm ct cd\">\u003ca class=\"ad pr pr-mr\" style=\"width:300px;height:250px\">\u003cspan class=\"pr-radar r-l\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003 -3 5-3 8 0s5 3 8 0\" fill=\"none\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003cpath d=\"M4 10c3-3 5-3 8 0s5 3 8 0\" fill=\"none\" opacity=\".5\" stroke=\"#062519\" stroke-linecap=\"round\" stroke-width=\"2.2\">\u003c/path>\u003c/svg>Pannonhitel\u003c/span>\u003cspan class=\"sp-txt\">Finanszírozás magyar vállalkozásoknak.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"sec wrap tight\">\u003cdiv class=\"stats\">\u003cdiv>\u003cb>1989\u003c/b>\u003cspan>alapítás éve\u003c/span>\u003c/div>\u003cdiv>\u003cb>XXXVIII.\u003c/b>\u003cspan>évfolyam\u003c/span>\u003c/div>\u003cdiv>\u003cb>2004\u003c/b>\u003cspan>óta európai fókusz\u003c/span>\u003c/div>\u003cdiv>\u003cb>2026\u003c/b>\u003cspan>a digitális lendület éve\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap\">\u003cp class=\"kick\">Mérföldkövek\u003c/p>\u003ch2 class=\"h2\">Négy évtized, négy fordulópont\u003c/h2>\u003cp class=\"intro\">Egy gazdasági lap hitelét nem az adja, hogy mit ígér, hanem hogy mennyi ideje van jelen. Ez az oldal nem teljes archívum: néhány mérföldkő és néhány eredeti lapszám, bizonyítéknak.\u003c/p>\u003cdiv class=\"miles\">\u003cdiv>\u003cb>1989\u003c/b>\u003ch3>Alapítás\u003c/h3>\u003cp>A lap a rendszerváltás küszöbén indult Új Gazdasági Magazin néven, a műszaki fejlesztések és az újonnan alakult cégek bemutatásával.\u003c/p>\u003c/div>\u003cdiv>\u003cb>2004\u003c/b>\u003ch3>Európai fókusz\u003c/h3>\u003cp>Az uniós csatlakozás évétől a lap neve és iránya is megváltozott: az európai gazdasági információ magyar nyelvű közvetítése lett a feladat.\u003c/p>\u003c/div>\u003cdiv>\u003cb>XXXVIII.\u003c/b>\u003ch3>Évfolyam\u003c/h3>\u003cp>A magazin azóta is folyamatosan megjelenik — nyomtatásban a döntéshozói listára, digitálisan a vállalkozói körnek.\u003c/p>\u003c/div>\u003cdiv>\u003cb>2026\u003c/b>\u003ch3>Digitális lendület\u003c/h3>\u003cp>A portál indulásával a lap a digitális szemléletváltás kommunikációs partnere lesz, a nyomtatott kiadás mellett.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap alt\">\u003cdiv class=\"issue\">\u003cspan class=\"im\" style=\"aspect-ratio:210/297;display:grid;place-items:center;font-size:13px;color:#5f6a7c\">Borító készül\u003c/span>\u003cdiv>\u003cp class=\"kick\">Készülő kiadás\u003c/p>\u003ch4>Visszatekintő szám\u003c/h4>\u003cdiv class=\"prose\">\u003cp>32–40 oldalas válogatás a magazin évtizedeiből, témák szerint rendezve, mai szerkesztői bevezetőkkel. A szám egyszerre mutatja meg, hogyan változott a hazai vállalkozói világ, és hogyan írt róla a lap.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"sec wrap\">\u003ch2 class=\"h2\">Eredeti lapszámok, bizonyítéknak\u003c/h2>\u003cp class=\"intro\">Néhány lapszám az eredeti nyomtatott tördelésben, lapozható formában. Archív anyagok: a megjelenésük idejének állapotát tükrözik, nem a mai szerkesztőségi álláspontot.\u003c/p>\u003ch3 class=\"kick\" style=\"font-size:15px\">A digitalizáció évtizede\u003c/h3>\u003cdiv class=\"issues\">\u003cdiv class=\"issue\">\u003ca data-p=\"lapozo\">\u003cspan class=\"im\">\u003cimg alt=\"A(z) 2018. november lapszám borítója\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/lapszamok/2018-11/borito.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003ch4 data-p=\"lapozo\">2018. november\u003c/h4>\u003csmall>XXX. évfolyam\u003c/small>\u003cp>Digitális lendület: a Modern Vállalkozások Programja, a CSR és a vállalkozói digitalizáció gyakorlata.\u003c/p>\u003csmall>53 oldal · 6 kiemelt írás\u003c/small>\u003ca class=\"more\" data-p=\"lapozo\">Lapozom\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"issue\">\u003ca data-p=\"lapozo\">\u003cspan class=\"im\">\u003cimg alt=\"A(z) 2016. december – január lapszám borítója\" decoding=\"async\" loading=\"lazy\" src=\"https://grafcom.hu/_eugm/assets/lapszamok/2016-12/borito.webp\"/>\u003c/span>\u003c/a>\u003cdiv>\u003ch4 data-p=\"lapozo\">2016.
